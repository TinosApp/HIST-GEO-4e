 décrire des cas de violation dans la commune, à présenter d'autres cas au Bénin et dans le monde, puis à expliquer pourquoi ces violations persistent.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Dans une commune comme Bohicon, les violations les plus flagrantes sont le phénomène des enfants placés ou « vidomègon », le travail des enfants et les violences faites aux femmes et aux enfants. Les enfants placés, souvent issus de familles pauvres, sont confiés à des parents aisés qui les font travailler dans des conditions difficiles, parfois sans éducation, sans soins adéquats ni loisirs. Le travail des enfants de moins de 14 ans, formellement interdit, se rencontre encore sur les chantiers. Enfin, les violences physiques (bastonnade exagérée) et verbales (insultes, dénigrements) frappent les femmes et les enfants. <b>Mais ces atteintes ne sont pas limitées à notre milieu de vie.</b></p>\n<p>Chaque année, de nombreuses violences sexuelles sont enregistrées au Bénin et dans le monde. Il existe aussi des mutilations, l'enrôlement d'enfants-soldats, des génocides comme ceux des Tutsi du Rwanda et des Juifs d'Europe, des privations arbitraires d'eau et des restrictions abusives des libertés individuelles, comme au Mali, en République démocratique du Congo ou en Palestine. Presque partout, les femmes subissent des inégalités de droit et de fait. <b>Reste à comprendre pourquoi ces violations durent.</b></p>\n<p>L'ignorance des textes empêche les victimes de réclamer leurs droits et les auteurs de mesurer leurs fautes. La non-application des lois laisse les coupables impunis. La pauvreté pousse certains parents à placer leurs enfants, et des stéréotypes ainsi que des pratiques traditionnelles entretiennent la discrimination envers les femmes.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Des enfants placés aux génocides, les violations des droits de l'homme touchent tous les milieux et tous les continents, et persistent par ignorance, par non-application des lois, par pauvreté et par habitude. La lutte contre ces violations passe par la connaissance et l'application des textes qui protègent les droits de l'homme.</p>\n</div></details>\n\n<h2 id=\"s3\"><span class=\"badge\">Sujet 3</span>Dissertation · Le génocide des Tutsi au Rwanda</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Lors de la commémoration du génocide rwandais, ton professeur d'histoire te demande de présenter cet événement à ta classe.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente du génocide des Tutsi au Rwanda.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Explique les causes du génocide rwandais.</li><li>Décris le déroulement du génocide rwandais.</li><li>Relève ses conséquences.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>En 1994, en cent jours seulement, près d'un million de personnes ont été massacrées au Rwanda, au vu et au su du monde entier. Ce crime, qui vise à détruire un groupe national, ethnique, racial ou religieux, porte le nom de génocide, mot créé en 1944 pour qualifier l'extermination des Juifs et des Tsiganes par les nazis. Le génocide des Tutsi, qui a des causes anciennes et un déclencheur précis, a eu des conséquences très lourdes pour le Rwanda et la région. Notre devoir consistera à expliquer les causes du génocide rwandais, à décrire son déroulement, puis à relever ses conséquences.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Les causes sont liées à l'injustice créée par la colonisation : les colonisateurs ont confié à la minorité tutsi des responsabilités dans l'administration et cantonné la majorité hutu dans l'agriculture et l'ignorance, ce qui a engendré de violentes oppositions entre les deux groupes. <b>Ces tensions éclatent en 1994.</b></p>\n<p>Le 6 avril 1994, l'avion du président Juvénal Habyarimana, un Hutu, est abattu près de Kigali. Cet événement sert de déclencheur à l'exécution méthodique des Tutsi. Malgré la présence de forces françaises, belges et onusiennes, près d'un million de personnes sont tuées en cent jours. <b>Ce drame a laissé de profondes séquelles.</b></p>\n<p>Plus d'un million de Hutu fuient alors le Rwanda pour se réfugier en République démocratique du Congo. En novembre 1994, le Conseil de sécurité de l'ONU crée le Tribunal pénal international pour le Rwanda, chargé de juger les responsables du génocide. Le pays doit en outre se reconstruire et réapprendre la réconciliation.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Né de l'injustice coloniale et déclenché le 6 avril 1994, le génocide des Tutsi a fait près d'un million de morts en cent jours et bouleversé toute la région. Comment éviter qu'un tel drame ne se reproduise ?</p>\n</div></details>\n\n<h2 id=\"s4\"><span class=\"badge\">Sujet 4</span>Dissertation · La Shoah</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>À l'occasion de la journée internationale de commémoration des victimes de l'Holocauste, ton professeur te demande de présenter la Shoah.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente de la Shoah.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Explique les causes de la Shoah.</li><li>Décris ses manifestations.</li><li>Précise ses conséquences.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>De 1933 à 1945, l'Allemagne nazie a organisé, avec l'appui de nombreux pays alliés ou occupés, l'extermination des Juifs d'Europe, qu'on appelle la Shoah. Fondée sur une idéologie raciste, cette politique s'est traduite par des persécutions de plus en plus violentes et a laissé des conséquences durables. Notre devoir consistera à expliquer les causes de la Shoah, à décrire ses manifestations, puis à préciser ses conséquences.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Pour Hitler et les dirigeants nazis, les Juifs représentent une menace pour la pureté de la race aryenne. Ils les accusent de comploter pour dominer le monde et les jugent « inférieurs » au peuple allemand. L'objectif nazi est donc de les éliminer. <b>Cette idéologie se traduit dès l'arrivée de Hitler au pouvoir par des persécutions.</b></p>\n<p>Les Juifs et les Tsiganes subissent d'abord une discrimination systématique : exclusion, entassement dans les ghettos, pillages et meurtres. L'extermination devient ensuite un programme politique, l'Endlösung ou « solution finale », appliqué en Allemagne et dans les pays alliés ou occupés. À partir de 1941, des camps de concentration et d'extermination sont créés, où les déportés sont tués par gazage, par fusillade et par d'autres moyens. Au total, des millions de Juifs, de Tsiganes, de Slaves et d'autres minorités sont massacrés. <b>Ces crimes ont eu des conséquences considérables après la guerre.</b></p>\n<p>De 1945 à 1946, le procès de Nuremberg, devant un Tribunal militaire international, juge et condamne les principaux responsables. Pour éviter d'autres massacres du même genre, les dirigeants de l'Agence juive créent un État juif en Palestine : c'est la naissance de l'État d'Israël. Peu à peu, une mémoire spécifique de la Shoah s'est construite.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Née d'une idéologie raciste, la Shoah a causé la mort de millions de personnes avant de conduire au procès de Nuremberg et à la naissance d'Israël. Cette mémoire nourrit aujourd'hui la lutte contre toute forme de génocide.</p>\n</div></details>\n\n<h2 id=\"s5\"><span class=\"badge\">Sujet 5</span>Dissertation · Protéger les droits de l'homme et cultiver la paix</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'un exposé au club de culture de la paix de ton collège, tu dois montrer comment on peut protéger les droits de l'homme.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente des conditions de protection des droits de l'homme et de culture de la paix.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Dis ce qu'il faut faire pour protéger les droits de l'homme.</li><li>Présente les textes qui garantissent ces droits.</li><li>Explique comment le respect des droits de l'homme garantit la paix.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>Partout dans le monde, les droits de l'homme ne sont pas toujours respectés, et ce manque de respect nourrit les conflits. Pour les protéger et construire la paix, il faut agir à plusieurs niveaux : connaître les droits, s'appuyer sur des textes et des institutions, et adopter des comportements responsables. Notre devoir consistera à dire ce qu'il faut faire pour protéger les droits de l'homme, à présenter les textes qui les garantissent, puis puis à expliquer comment leur respect, soutenu par des institutions, garantit la paix.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Il faut d'abord faire connaître aux populations les lois qui protègent les droits de l'homme. Les autorités doivent ensuite les appliquer à leurs niveaux respectifs, et les citoyens doivent adopter des comportements responsables en respectant les droits des autres. Il faut aussi éduquer aux droits humains, reconnaître l'identité culturelle de l'autre, garantir à tous le minimum vital (logement, soins, nourriture, éducation, habillement), accomplir ses devoirs et promouvoir la non-violence. <b>Ces actions s'appuient sur des textes de référence.</b></p>\n<p>Le principal texte mondial est la Déclaration universelle des droits de l'homme, adoptée par l'ONU le 10 décembre 1948. Elle forme, avec deux pactes internationaux, la Charte internationale des droits de l'homme. En Afrique, la Charte africaine des droits de l'homme et des peuples, de l'Union africaine, a été adoptée à Nairobi en 1981. Au Bénin, la Constitution du 11 décembre 1990 garantit ces droits. La conférence d'Helsinki, en 1975, avait déjà mis l'accent sur la défense des libertés. <b>Mais des textes ne suffisent pas : des institutions veillent à leur respect.</b></p>\n<p>La Ligue des droits de l'homme, Amnesty International, fondée à Londres en 1961, et la Police républicaine contribuent à la protection des droits ; des tribunaux comme le Tribunal pénal international pour le Rwanda jugent les crimes les plus graves. Ainsi protégé, le respect des droits de l'homme permet d'éviter ou de régler de nombreux conflits : il prévient la révolte des individus et des peuples qui se sentent opprimés, ce qui garantit la paix sociale.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Connaissance des lois, textes nationaux et internationaux, institutions de contrôle et comportements responsables forment les conditions de protection des droits de l'homme, donc de la culture de la paix. Comment chacun peut-il, dans son milieu de vie, contribuer à cette culture de la paix ?</p>\n</div></details>\n\n<h2 id=\"s6\"><span class=\"badge\">Sujet 6</span>Explication de texte · Les principes des droits de l'homme</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'une recherche sur les droits de l'homme, tu étudies un texte qui définit cette notion et ses principes.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente de la notion de droits de l'homme.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">Les droits de l'homme, ou droits humains, désignent le concept selon lequel tout être humain possède des droits, quel que soit le contexte dans lequel il se trouve. Ces droits sont inhérents à la personne humaine. Ils reposent sur quelques principes fondateurs : l'universalité, l'indivisibilité, l'égalité et la non-discrimination, l'imprescriptibilité et la solidarité. La Charte internationale des droits de l'homme réunit la Déclaration universelle des droits de l'homme et deux pactes internationaux.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de Degla (R.), Les droits de l'homme et la Charte africaine des droits de l'homme et des peuples, Cotonou, 2010.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique la notion de droits de l'homme d'après le texte.</li><li>Dégage l'intérêt de l'étude de ce texte.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré d'un ouvrage de R. Degla, intitulé « Les droits de l'homme et la Charte africaine des droits de l'homme et des peuples » et publié à Cotonou en 2010. Il met en exergue la définition des droits de l'homme et les principes sur lesquels ils reposent.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>L'auteur définit d'abord la notion : les droits de l'homme désignent « le concept selon lequel tout être humain possède des droits, quel que soit le contexte dans lequel il se trouve ». Autrement dit, ils ne dépendent ni du pays, ni de la situation de la personne. Il précise que ces droits « sont inhérents à la personne humaine » : on naît avec eux, personne ne les accorde.</p>\n<p>Il énumère ensuite les principes fondateurs : « l'universalité, l'indivisibilité, l'égalité et la non-discrimination, l'imprescriptibilité et la solidarité ». Il termine par les textes : « la Charte internationale des droits de l'homme réunit la Déclaration universelle des droits de l'homme et deux pactes internationaux ». Ces textes donnent une base juridique à ces principes.</p>\n<div class=\"lab\">Conclusion (intérêt du texte)</div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de bien comprendre ce que sont les droits de l'homme, les principes qui les fondent et les textes qui les protègent.</p>\n</div></details>\n\n<h2 id=\"s7\"><span class=\"badge\">Sujet 7</span>Explication de texte · Droits de l'homme et culture de la paix</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'un exposé sur la culture de la paix, tu étudies un texte qui relie le respect des droits de l'homme à la paix.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente du lien entre droits de l'homme et culture de la paix.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">Le respect et la protection des droits de l'homme permettent de prévenir efficacement la révolte des individus ou des peuples qui se sentent opprimés. La Déclaration des Nations unies sur une culture de la paix la définit comme un ensemble de valeurs, d'attitudes, de comportements et de modes de vie fondés, entre autres, sur le respect des droits de l'homme et des libertés fondamentales. De nombreux États africains sont pourtant déchirés par des guerres civiles qui opposent des populations de langues, de religions et de cultures différentes, comme ce fut le cas au Nigeria et au Tchad.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de Degla (R.), Les droits de l'homme et la Charte africaine des droits de l'homme et des peuples, Cotonou, 2010.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique le lien entre le respect des droits de l'homme et la culture de la paix.</li><li>Dégage l'intérêt de l'étude de ce texte.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré d'un ouvrage de R. Degla, intitulé « Les droits de l'homme et la Charte africaine des droits de l'homme et des peuples » et publié à Cotonou en 2010. Il insiste sur le rôle du respect des droits de l'homme dans la prévention des conflits et dans la culture de la paix.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>L'auteur affirme d'abord que « le respect et la protection des droits de l'homme permettent de prévenir efficacement la révolte des individus ou des peuples qui se sentent opprimés ». Quand les droits sont respectés, les causes de la colère disparaissent. Il rappelle que la Déclaration des Nations unies définit la culture de la paix comme « un ensemble de valeurs, d'attitudes, de comportements et de modes de vie » fondés « sur le respect des droits de l'homme et des libertés fondamentales ».</p>\n<p>Il illustre le danger par un contre-exemple : « de nombreux États africains sont pourtant déchirés par des guerres civiles », qui opposent des populations « de langues, de religions et de cultures différentes », comme au Nigeria et au Tchad. Ces conflits montrent que, sans respect des droits et de la diversité, la paix est menacée.</p>\n<div class=\"lab\">Conclusion (intérêt du texte)</div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de comprendre que la paix ne peut durer sans le respect des droits de l'homme et de comprendre pourquoi les États doivent protéger la diversité de leurs populations.</p>\n</div></details>\n\n<h2 id=\"s8\"><span class=\"badge\">Sujet 8</span>Explication de texte · L'idéologie nazie et la Shoah</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'une recherche sur la Seconde Guerre mondiale, tu étudies un texte consacré à l'idéologie des nazis envers les Juifs.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente de la politique nazie envers les Juifs.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">Pour les nazis, les Juifs représentent un danger : ils affirment qu'un complot juif cherche à dominer le monde et jugent le peuple juif inférieur. Leur objectif est donc de l'éliminer. Une fois au pouvoir, Hitler applique une politique de discrimination systématique contre les Allemands juifs, puis une politique d'extermination étendue à tous les pays que l'Allemagne contrôle, directement ou indirectement, à partir du déclenchement de la Seconde Guerre mondiale.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de Microsoft Encarta (2009).</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique la politique nazie envers les Juifs d'après le texte.</li><li>Dégage l'intérêt de l'étude de ce texte.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré de l'encyclopédie Microsoft Encarta, publiée en 2009. Il aborde les raisons et les étapes de la politique nazie envers les Juifs.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>L'auteur explique d'abord les raisons de cette politique : « pour les nazis, les Juifs représentent un danger », car ils croient à « un complot juif » qui « cherche à dominer le monde » et jugent le peuple juif « inférieur ». Ces idées racistes fondent l'objectif nazi, résumé par l'auteur : « Leur objectif est donc de l'éliminer ».</p>\n<p>Le texte montre ensuite deux étapes. Une fois Hitler au pouvoir, il applique « une politique de discrimination systématique contre les Allemands juifs » : exclusion, ghettos, pillages. Puis, avec la guerre, il étend « une politique d'extermination » aux pays que l'Allemagne contrôle : c'est la solution finale, qui conduit aux camps et à la mort de millions de personnes.</p>\n<div class=\"lab\">Conclusion (intérêt du texte)</div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de comprendre comment une idéologie raciste a conduit de la discrimination à l'extermination et pourquoi il faut combattre toute forme de racisme.</p>\n</div></details>\n\n<h2 id=\"s9\"><span class=\"badge\">Sujet 9</span>Explication de texte · Les génocides du XXe siècle</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'une recherche sur les génocides, tu étudies un texte consacré au Cambodge et à la mémoire de la Shoah.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente de ce que furent le génocide cambodgien et la Shoah.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">De 1975 à 1979, le Cambodge est dominé par les Khmers rouges. À leur arrivée au pouvoir, ils vident les villages de leur population. Les privations, les mauvais traitements, les déportations massives, le travail forcé, les exécutions et les massacres font deux à trois millions de morts : c'est un véritable génocide. Pour les Juifs, sur les 76 000 déportés de France vers les camps nazis, seuls 2 500 échappent à l'extermination. Ce n'est que progressivement que s'affirme une mémoire spécifique de la Shoah.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de Lambin (J.-M.) (dir.), Histoire Terminales ES-L-S, Paris, Hachette Éducation, 2004.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique les génocides évoqués dans le texte.</li><li>Dégage l'intérêt de l'étude de ce texte.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré d'un manuel de J.-M. Lambin et de ses collaborateurs, intitulé « Histoire Terminales ES-L-S » et publié à Paris, chez Hachette Éducation, en 2004. Il met en relief deux génocides du XXe siècle : celui du Cambodge et la Shoah.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Pour le Cambodge, l'auteur indique que, « de 1975 à 1979 », le pays « est dominé par les Khmers rouges », qui, dès leur arrivée au pouvoir, « vident les villages de leur population ». Il énumère les violences : « les privations, les mauvais traitements, les déportations massives, le travail forcé, les exécutions et les massacres ». Le bilan est terrible : « deux à trois millions de morts », ce qui permet de parler de « véritable génocide ».</p>\n<p>Pour les Juifs, il donne l'exemple de la France : « sur les 76 000 déportés de France vers les camps nazis, seuls 2 500 échappent à l'extermination ». Il termine en notant que « ce n'est que progressivement que s'affirme une mémoire spécifique de la Shoah » : il a fallu du temps pour que le monde reconnaisse l'ampleur de ce crime.</p>\n<div class=\"lab\">Conclusion (intérêt du texte)</div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de découvrir deux génocides du XXe siècle, de mesurer l'ampleur de leurs victimes et de comprendre l'importance du devoir de mémoire.</p>\n</div></details>\n\n<h2 id=\"s10\"><span class=\"badge\">Sujet 10</span>Explication de texte · Les comportements de paix</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'une campagne pour la paix dans ton établissement, tu étudies un texte qui propose des comportements et des actions en faveur des droits humains.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des actions qui permettent de faire rimer droits humains et paix sociale.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">Partout dans le monde, et surtout en Afrique, des hommes, des femmes et des enfants fuient les catastrophes naturelles et les guerres. Pour que le respect des droits humains rime avec la paix sociale, des comportements et des actions s'imposent : mieux connaître les instruments nationaux et internationaux sur les droits humains ; éduquer aux droits humains dans toutes les structures ; reconnaître l'identité culturelle de l'autre ; garantir à tous l'accès au minimum vital, c'est-à-dire au logement, aux soins, à la nourriture, à l'éducation et à l'habillement ; accomplir ses devoirs ; promouvoir la non-violence.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de DIP, Histoire-Géographie, document d'accompagnement 4ème.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique les actions qui favorisent la paix sociale.</li><li>Dégage l'intérêt de l'étude de ce texte.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré du document d'accompagnement du programme d'histoire-géographie de la classe de quatrième, publié par la Direction de l'inspection pédagogique. Il aborde les comportements et les actions qui permettent de faire rimer droits humains et paix sociale.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>L'auteur part d'un constat : « partout dans le monde, et surtout en Afrique, des hommes, des femmes et des enfants fuient les catastrophes naturelles et les guerres ». Il propose alors des solutions, car « des comportements et des actions s'imposent » pour que le respect des droits humains « rime avec la paix sociale ». Il demande d'abord de « mieux connaître les instruments nationaux et internationaux sur les droits humains », puis d'« éduquer aux droits humains dans toutes les structures ».</p>\n<p>Il invite ensuite à « reconnaître l'identité culturelle de l'autre » et à « garantir à tous l'accès au minimum vital », c'est-à-dire au logement, aux soins, à la nourriture, à l'éducation et à l'habillement. Il termine par le devoir de chacun : « accomplir ses devoirs » et « promouvoir la non-violence ». Ces actions concernent à la fois l'État, l'école et chaque citoyen.</p>\n<div class=\"lab\">Conclusion (intérêt du texte)</div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de découvrir des actions concrètes pour construire la paix et de comprendre que chacun, à son niveau, peut contribuer à une culture de la paix.</p>\n</div></details>","sa4":"<p class=\"sub\">Géographie · 5 dissertations et 5 explications de texte · format béninois : contexte d'évaluation, tâche, consigne</p>\n<div class=\"box\"><b>Rappel.</b> Chaque consigne ne porte que sur un seul volet : une consigne, un paragraphe ; une dissertation compte au plus trois consignes. <i>Dissertation :</i> introduction en un seul bloc (préambule, problématique affirmative, annonce du plan en questions ou sous forme affirmative) ; un paragraphe par consigne, reliés par des phrases de transition en gras ; conclusion (bilan et ouverture) ; ni tirets, ni astérisques dans la rédaction. <i>Explication de texte :</i> introduction = source + idée générale introduite par « il met en exergue / en relief… », « il aborde… » ou « il insiste sur… » ; corps = réponse à la consigne 2 appuyée sur au moins trois extraits entre guillemets ; conclusion = en Géographie, ton opinion justifiée. Les textes sont des textes d'entraînement : à l'examen, la source figure sous le texte, ne l'invente jamais.</div>\n<div class=\"box rule\"><b>Chiffres à retenir.</b> Population : 898 000 hab. en 1910 ; 1 528 000 en 1950 ; 2 106 000 en 1961 ; 3 331 210 en 1979 ; 9 983 884 en 2013 ; 22 100 000 attendus en 2050. Taux d'accroissement : 1,8 % (1910-1950), 2,8 % (1979-1992), 3 % (2002-2013). Natalité : 49 ‰ ; mortalité : 19 ‰ (2012). Population : 47 % de moins de 15 ans ; 49 % d'hommes, 51 % de femmes. Fécondité : 5,7 enfants par femme. Ces chiffres sont ceux de la fiche de cours ; à l'examen, utilise ceux que le sujet te donne.</div>\n\n<h2 id=\"s1\"><span class=\"badge g\">Sujet 1</span>Dissertation · L'évolution et la structure de la population du Bénin</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre du club de géographie de ton collège, on te demande de présenter la population béninoise à tes camarades.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente de l'évolution et de la structure de la population du Bénin.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente l'évolution de la population béninoise.</li><li>Décris la structure de la population béninoise.</li><li>Montre que cette croissance est rapide par rapport aux ressources.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>La population est la première richesse d'un pays, mais elle devient un défi quand elle croît plus vite que les ressources. Rapide et d'une extrême jeunesse, la population béninoise croît plus vite que les ressources du pays. Notre devoir consistera à présenter l'évolution de la population béninoise, à décrire sa structure, puis à montrer que sa croissance est rapide par rapport aux ressources.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Selon les recensements et les enquêtes, le Bénin comptait 898 000 habitants en 1910. Sa population est passée à 1 528 000 habitants en 1950, à 2 106 000 en 1961, à 3 331 210 en 1979 et à 9 983 884 en 2013. Si la tendance se poursuit, elle pourrait atteindre 22 100 000 habitants en 2050. <b>Cette évolution s'accompagne d'une structure particulière.</b></p>\n<p>La population béninoise est extrêmement jeune : 4 % des habitants ont moins d'un an, 17 % moins de 5 ans et 47 % moins de 15 ans ; au recensement de 1992, plus de la moitié avait moins de 16 ans. Elle est aussi à dominance féminine, avec environ 49 % d'hommes et 51 % de femmes. Sa pyramide des âges a donc une base très large et un sommet étroit. <b>Cette jeunesse explique en grande partie la rapidité de la croissance.</b></p>\n<p>Le taux d'accroissement est passé de 1,8 % entre 1910 et 1950 à 2,8 % entre 1979 et 1992, puis à environ 3 % entre 2002 et 2013 : le rythme s'accélère. Entre 1979 et 2013, la population a presque triplé. Or les ressources, elles, n'augmentent pas au même rythme : la pression sur les terres cultivables, sur les plans d'eau et sur les services sociaux grandit, ce qui entretient la pauvreté.</p>\n<div class=\"lab\">Conclusion</div>\n<p>De 898 000 habitants en 1910 à près de 10 millions en 2013, la population béninoise a connu une croissance rapide, portée par sa jeunesse et dépassant les ressources disponibles. Quels facteurs expliquent cette évolution ?</p>\n</div></details>\n\n<h2 id=\"s2\"><span class=\"badge g\">Sujet 2</span>Dissertation · Les mouvements naturels de la population</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Au cours d'un exposé sur la démographie, ton professeur te demande d'expliquer pourquoi la population du Bénin augmente aussi vite.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente des mouvements naturels de la population béninoise.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Explique la forte natalité au Bénin.</li><li>Explique la baisse de la mortalité au Bénin.</li><li>Explique l'accroissement naturel de la population béninoise.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>Une population varie sous l'effet des naissances, des décès et des migrations. Au Bénin, une natalité très élevée et une mortalité en baisse entraînent un accroissement naturel rapide de la population. Notre devoir consistera à expliquer la forte natalité, à expliquer la baisse de la mortalité, puis à expliquer l'accroissement naturel de la population.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>La natalité est le nombre de naissances enregistrées dans une population en une période donnée ; on la mesure par le taux de natalité, c'est-à-dire le nombre de naissances pour 1 000 habitants, estimé à 49 ‰ au Bénin en 2012. Cette forte natalité s'explique par l'amélioration progressive des soins de santé néonatale, par une fécondité élevée, par un meilleur état nutritionnel et par le niveau d'instruction de la population. La fécondité reste forte parce que les adolescentes et les femmes de plus de 35 ans ont beaucoup d'enfants, parce que les filles entrent tôt en union, surtout en milieu rural, parce que le mariage est quasi universel, parce que la contraception est peu utilisée et parce que la polygamie persiste. <b>En face de cette natalité, la mortalité diminue.</b></p>\n<p>La mortalité est le nombre de décès enregistrés dans une population en une période donnée ; son taux, le nombre de décès pour 1 000 habitants, est estimé à 19 ‰ en 2012. Encore assez élevé, surtout chez les enfants, il recule grâce à l'amélioration de la qualité de vie, aux progrès de la médecine, à la généralisation des règles d'hygiène et à la vulgarisation des mesures socio-sanitaires. <b>Natalité élevée et mortalité en baisse ont un effet direct sur l'effectif de la population.</b></p>\n<p>L'accroissement naturel est la différence entre les naissances et les décès ; son taux, calculé pour 100 habitants, est d'environ 3 % entre 2002 et 2013. Avec 49 ‰ de naissances pour 19 ‰ de décès, l'écart s'élargit : c'est ce qui explique l'augmentation rapide de l'effectif de la population.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Avec 49 ‰ de naissances pour 19 ‰ de décès, le Bénin connaît un accroissement naturel rapide, dû à une forte natalité et à une mortalité en baisse. Ces mouvements naturels s'accompagnent de mouvements dans l'espace, qui modifient aussi la répartition de la population.</p>\n</div></details>\n\n<h2 id=\"s3\"><span class=\"badge g\">Sujet 3</span>Dissertation · Les mouvements de population dans l'espace</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Un de tes camarades de classe, originaire du nord, vient d'arriver à Cotonou. Ton professeur te demande de présenter les déplacements de populations au Bénin.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente des mouvements de la population béninoise dans l'espace.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente les migrations internes.</li><li>Présente les migrations externes.</li><li>Dégage les conséquences de ces mouvements.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>Les hommes se déplacent pour chercher du travail, des terres ou un meilleur cadre de vie. Les mouvements de la population béninoise dans l'espace, internes comme externes, répondent à la recherche d'un mieux-être et transforment la répartition de la population. Notre devoir consistera à présenter les migrations internes, puis les migrations externes, avant de dégager leurs conséquences.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Les migrations internes sont celles qui se font à l'intérieur du pays, d'une région vers une autre : exode rural, déplacements d'une ville vers une autre ou d'une ville vers sa banlieue. Les jeunes ruraux désertent les villages pour les centres urbains comme Cotonou, Porto-Novo, Parakou et Abomey, et des jeunes de l'Atacora se rendent dans le Borgou et le Zou-Nord à la recherche de nouvelles terres. <b>À ces déplacements s'ajoutent des départs hors du pays.</b></p>\n<p>Les migrations externes sont les départs de population du Bénin vers d'autres pays, ou émigrations, et les arrivées d'autres pays au Bénin, ou immigrations. Elles sont dominées par le départ d'enfants mineurs et de jeunes diplômés vers les pays développés (Canada, États-Unis, Europe de l'Ouest) ou vers des pays africains comme le Nigeria, le Gabon, le Congo ou la Côte d'Ivoire. Elles peuvent être volontaires ou forcées, et le trafic d'enfants se développe entre le Bénin et ses voisins. Leur bilan se mesure par le solde migratoire, différence entre le nombre d'immigrés et celui d'émigrés. Ces départs s'expliquent surtout par la recherche d'un emploi et d'un mieux-être. <b>Ces mouvements ont des conséquences importantes.</b></p>\n<p>Les conséquences sont importantes : croissance rapide des villes (Cotonou, Abomey-Calavi, Porto-Novo, Bohicon, Parakou), manque de logements et de services, bidonvilles, chômage ; dans les campagnes, départ des bras valides, vieillissement et recul de la production ; fuite des cerveaux vers l'étranger.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Exode rural, migrations vers l'étranger et trafic d'enfants montrent que les Béninois se déplacent pour améliorer leurs conditions de vie, au prix de déséquilibres entre villes et campagnes. Quels problèmes l'évolution démographique pose-t-elle aux villes et aux campagnes ?</p>\n</div></details>\n\n<h2 id=\"s4\"><span class=\"badge g\">Sujet 4</span>Dissertation · Les problèmes démographiques en ville et à la campagne</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Un organisme lance un concours sur le thème « Développons nos campagnes ». Tu es sélectionné(e) et tu dois présenter les problèmes liés à l'évolution démographique.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente des problèmes liés à l'évolution démographique au Bénin.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente les problèmes démographiques des milieux urbains.</li><li>Présente les problèmes démographiques des campagnes.</li><li>Explique le lien entre ces problèmes et le déséquilibre entre population et ressources.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>L'augmentation de la population transforme les espaces béninois et crée des difficultés très différentes en ville et à la campagne. Ces problèmes, liés à l'évolution démographique, s'expliquent par un déséquilibre entre une population qui augmente et des ressources limitées. Notre devoir consistera à présenter les problèmes des milieux urbains, puis ceux des campagnes, avant d'expliquer le lien avec le déséquilibre entre population et ressources.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Dans les villes, l'exode rural et la croissance démographique créent des problèmes fonciers et font apparaître des bidonvilles qui contrastent avec les quartiers résidentiels huppés. S'y ajoutent la mauvaise qualité de vie des ménages sans grands moyens, les problèmes de santé et de nutrition, les difficultés d'aménagement urbain, l'insécurité, le manque de scolarisation et d'emploi, et les pollutions : en 1992, les grandes villes produisaient environ 1 000 m³ de déchets par jour, et la multiplication de moyens de transport très polluants dégrade l'air. <b>Les campagnes connaissent d'autres difficultés.</b></p>\n<p>Dans les campagnes, la fécondité est élevée, les jeunes capables de travailler la terre partent, la population restée au village vieillit et la production agricole recule. Les problèmes de santé et de nutrition y sont aussi présents, l'espérance de vie est faible et la transhumance entraîne de l'insécurité dans certaines localités. La pression sur les terres cultivables et sur les plans d'eau augmente, ce qui entraîne des techniques de pêche nocives. <b>Ces problèmes si différents ont pourtant une origine commune.</b></p>\n<p>L'effectif de la population ne cesse d'augmenter alors que les ressources disponibles restent faibles. En ville, ce déséquilibre se traduit par le manque de logements, d'emplois et de services ; à la campagne, par la raréfaction des terres et la baisse de la production. Ce déséquilibre entretient la pauvreté du pays et ralentit son développement.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Bidonvilles, chômage et pollution en ville, départ des jeunes, vieillissement et recul de la production à la campagne : les problèmes démographiques du Bénin ont une cause commune, le déséquilibre entre population et ressources. Face à ces problèmes, des mesures s'imposent dans tous les domaines.</p>\n</div></details>\n\n<h2 id=\"s5\"><span class=\"badge g\">Sujet 5</span>Dissertation · Les mesures pour mieux gérer les problèmes démographiques</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'une campagne de sensibilisation organisée dans ton quartier, on te demande de présenter des mesures pour mieux gérer les problèmes liés à l'évolution démographique.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente des mesures pour une meilleure gestion des problèmes démographiques au Bénin.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Propose des mesures générales pour mieux gérer ces problèmes.</li><li>Propose des mesures dans le domaine de la santé.</li><li>Propose des mesures pour améliorer le cadre de vie.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>Face aux problèmes que pose une population en croissance rapide, il ne suffit pas de les constater : il faut agir. Les mesures à adopter relèvent de l'information et de la sensibilisation, de la santé et de la planification familiale, de l'aménagement urbain et de la protection de l'environnement. Notre devoir consistera à proposer des mesures générales, puis des mesures de santé, enfin des mesures pour améliorer le cadre de vie.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Il faut d'abord informer, éduquer et communiquer sur les dangers d'une croissance démographique sans croissance économique, et sensibiliser sur les problèmes créés par le déséquilibre entre population et ressources. Il faut aussi apporter un appui matériel, technique et financier aux producteurs pour encourager leur sédentarisation dans les campagnes, et renforcer les mesures de sécurité dans les villes comme dans les campagnes. <b>Ces mesures s'accompagnent d'actions dans le domaine sanitaire.</b></p>\n<p>En matière de santé, l'État doit renforcer les soins préventifs, améliorer les soins curatifs et surveiller les épidémies ; il doit aussi vulgariser les soins prénatals, élargir la couverture vaccinale des enfants de moins de 5 ans et renforcer la lutte contre le paludisme, le sida et les autres infections sexuellement transmissibles. La planification familiale permet en outre une taille de famille en équilibre avec les ressources ; il faut sensibiliser à la réduction d'une fécondité encore précoce et élevée (5,7 enfants par femme), protéger les enfants, les scolariser et maintenir les filles à l'école. <b>Il faut enfin agir sur le cadre de vie.</b></p>\n<p>Il faut améliorer les plans directeurs d'aménagement des espaces urbains, réorganiser les transports urbains et assurer une bonne gouvernance environnementale. Il faut aussi mener des campagnes d'information sur les comportements qui menacent l'environnement, réprimer toute forme de pollution en ville comme à la campagne et participer à des projets de sauvegarde du milieu de vie par des comportements sains.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Information, santé, planification familiale, aménagement urbain et protection de l'environnement sont les piliers d'une meilleure gestion des problèmes démographiques du Bénin. Les Béninois sauront-ils s'approprier ces mesures pour bâtir un développement durable ?</p>\n</div></details>\n\n<h2 id=\"s6\"><span class=\"badge g\">Sujet 6</span>Explication de texte · L'évolution de la population béninoise</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'une recherche sur la démographie du Bénin, tu étudies un texte qui retrace l'évolution de la population.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente de l'évolution de la population du Bénin.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">En 1910, le Bénin comptait 898 000 habitants. Cette population est passée à 1 528 000 habitants en 1950, à 2 106 000 en 1961, à 3 331 210 en 1979 et à 9 983 884 en 2013. Le taux d'accroissement est passé de 1,8 % entre 1910 et 1950 à 2,8 % entre 1979 et 1992. Une caractéristique importante de cette population est sa jeunesse : plus de la moitié des habitants avaient moins de 16 ans au recensement de 1992.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de MECCAG-PDPE, La population au Bénin, Cotonou, 2000.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique l'évolution de la population béninoise d'après le texte.</li><li>Donne ton point de vue sur les conséquences de cette évolution pour le développement du pays.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré d'un ouvrage du MECCAG-PDPE, intitulé « La population au Bénin » et publié à Cotonou en 2000. Il met en exergue l'évolution rapide de la population béninoise et sa jeunesse.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>L'auteur retrace d'abord l'évolution de l'effectif : « en 1910, le Bénin comptait 898 000 habitants », puis la population est passée « à 1 528 000 habitants en 1950, à 2 106 000 en 1961, à 3 331 210 en 1979 et à 9 983 884 en 2013 ». En un siècle, elle a été multipliée par plus de dix.</p>\n<p>Il souligne ensuite l'accélération : « le taux d'accroissement est passé de 1,8 % entre 1910 et 1950 à 2,8 % entre 1979 et 1992 ». Il termine par une caractéristique essentielle : « sa jeunesse », puisque « plus de la moitié des habitants avaient moins de 16 ans au recensement de 1992 ». Une population jeune signifie beaucoup de futurs parents, donc une croissance qui se poursuit.</p>\n<div class=\"lab\">Conclusion (opinion)</div>\n<p>À notre avis, cette évolution est à la fois une chance et un défi. Une jeunesse nombreuse est une force de travail pour l'avenir, mais elle exige de créer des écoles, des emplois, des soins et des logements. Sans croissance économique suffisante, la croissance démographique rapide risque de freiner le développement du Bénin.</p>\n</div></details>\n\n<h2 id=\"s7\"><span class=\"badge g\">Sujet 7</span> Explication de texte · La forte fécondité au Bénin</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'un exposé sur la population, tu étudies un texte qui explique la forte fécondité au Bénin.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des facteurs de la forte fécondité au Bénin.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">La fécondité demeure élevée au Bénin. Elle s'explique notamment par une entrée précoce des filles en union, surtout en milieu rural, par l'universalité du mariage, par une faible prévalence contraceptive et par une polygamie persistante. Cette fécondité élevée entretient la croissance rapide de la population.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de MECCAG-PDPE, Déclaration de politique de population de la République du Bénin, Cotonou, 1996.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique les facteurs de la forte fécondité au Bénin.</li><li>Donne ton point de vue sur l'importance de la planification familiale.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré d'un document du MECCAG-PDPE, intitulé « Déclaration de politique de population de la République du Bénin » et publié à Cotonou en 1996. Il aborde les facteurs de la forte fécondité au Bénin.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>L'auteur constate d'abord que « la fécondité demeure élevée au Bénin ». Il en donne les causes : « une entrée précoce des filles en union, surtout en milieu rural », « l'universalité du mariage », « une faible prévalence contraceptive » et « une polygamie persistante ».</p>\n<p>Ces facteurs sociaux et culturels prolongent la période de procréation et multiplient les naissances. L'auteur en tire la conséquence : cette fécondité élevée « entretient la croissance rapide de la population ». Combinée à une mortalité en baisse, elle explique l'augmentation de l'effectif du pays.</p>\n<div class=\"lab\">Conclusion (opinion)</div>\n<p>À notre avis, la planification familiale est indispensable : elle permet à chaque couple d'avoir le nombre d'enfants qu'il peut nourrir, soigner et scolariser, et elle protège la santé des mères. Pour qu'elle réussisse, elle doit s'accompagner de la scolarisation des filles et de campagnes de sensibilisation qui respectent les familles.</p>\n</div></details>\n\n<h2 id=\"s8\"><span class=\"badge g\">Sujet 8</span>Explication de texte · Exode rural et émigration</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'une recherche sur les migrations, tu étudies un texte qui décrit les déplacements des jeunes au Bénin.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des déplacements de population au Bénin.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">De l'Atacora vers le Borgou et le Zou-Nord, les jeunes se déplacent à la recherche de nouvelles terres. Les jeunes ruraux désertent aussi les villages en direction des centres urbains comme Cotonou, Porto-Novo, Parakou ou Abomey, en quête d'un emploi rémunérateur et de loisirs. Même des intellectuels et des hommes d'affaires quittent le Bénin pour s'installer dans d'autres pays, comme le Nigeria, le Gabon ou la Côte d'Ivoire, pour des raisons d'emploi.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de CRAP/H-G (2003).</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique les déplacements de population décrits dans le texte.</li><li>Donne ton point de vue sur les effets de l'exode rural et de l'émigration sur le développement du Bénin.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré d'un document de la CRAP/H-G, daté de 2003. Il insiste sur les déplacements de population au Bénin, vers les villes, vers de nouvelles terres et vers l'étranger.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>L'auteur décrit d'abord des déplacements agricoles : « de l'Atacora vers le Borgou et le Zou-Nord, les jeunes se déplacent à la recherche de nouvelles terres », parce que les terres de départ s'épuisent ou deviennent insuffisantes. Il évoque ensuite l'exode rural : « les jeunes ruraux désertent aussi les villages en direction des centres urbains comme Cotonou, Porto-Novo, Parakou ou Abomey », attirés par « un emploi rémunérateur et de loisirs ».</p>\n<p>Il termine par les migrations externes : « même des intellectuels et des hommes d'affaires quittent le Bénin pour s'installer dans d'autres pays, comme le Nigeria, le Gabon ou la Côte d'Ivoire ». La cause est « des raisons d'emploi » : faute de débouchés au pays, les plus qualifiés partent. Le texte montre donc que la recherche d'un mieux-être pousse les Béninois à se déplacer à l'intérieur comme à l'extérieur du pays.</p>\n<div class=\"lab\">Conclusion (opinion)</div>\n<p>À notre avis, l'exode rural et l'émigration des diplômés freinent le développement du Bénin : les campagnes manquent de bras, les villes sont engorgées et le pays perd ses cadres. Pour inverser cette tendance, il faut créer des emplois, moderniser l'agriculture et équiper les campagnes en écoles, en soins et en routes.</p>\n</div></details>\n\n<h2 id=\"s9\"><span class=\"badge g\">Sujet 9</span>Explication de texte · Les problèmes des villes</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'une recherche sur l'urbanisation, tu étudies un texte qui décrit les difficultés des villes béninoises.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des problèmes liés à la croissance des villes.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">L'exode rural amène dans les villes de nouveaux ménages auxquels il faut rendre accessibles le logement, l'assainissement, l'hygiène, la communication et l'énergie. En 1992, la production de déchets était évaluée à 1 000 m³ par jour dans les grandes villes. La précarité des voies, l'insuffisance des transports en commun et le bas niveau du pouvoir d'achat ont favorisé la multiplication de moyens de transport très polluants, qui provoquent une pollution au-dessus des normes requises dans les centres urbains.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de MECCAG-PDPE (2000) et de Adam (K. S.) et Boko (M.), Le Bénin, Paris, Edicef, 1983.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique les problèmes que pose la croissance des villes.</li><li>Donne ton point de vue sur les solutions à apporter aux problèmes urbains.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré d'un ouvrage du MECCAG-PDPE publié en 2000 et d'un livre de K. S. Adam et M. Boko, intitulé « Le Bénin » et publié à Paris, chez Edicef, en 1983. Il met en relief les problèmes que pose la croissance rapide des villes béninoises.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>L'auteur part de la cause : « l'exode rural amène dans les villes de nouveaux ménages » auxquels il faut rendre accessibles « le logement, l'assainissement, l'hygiène, la communication et l'énergie ». Or les villes n'ont pas les moyens de répondre à tous ces besoins, d'où le manque de services et la multiplication de quartiers précaires.</p>\n<p>Il cite ensuite deux problèmes précis. D'abord les déchets : « en 1992, la production de déchets était évaluée à 1 000 m³ par jour dans les grandes villes ». Ensuite les transports : « la précarité des voies, l'insuffisance des transports en commun et le bas niveau du pouvoir d'achat ont favorisé la multiplication de moyens de transport très polluants », ce qui provoque une pollution « au-dessus des normes requises » dans les centres urbains.</p>\n<div class=\"lab\">Conclusion (opinion)</div>\n<p>À notre avis, les villes béninoises ont besoin de plans d'aménagement mieux appliqués, de transports en commun plus nombreux et d'un système sérieux de collecte des déchets. Chaque citoyen doit aussi changer ses comportements en évitant de jeter les ordures n'importe où : sans ces efforts, la croissance des villes dégradera davantage le cadre de vie.</p>\n</div></details>\n\n<h2 id=\"s10\"><span class=\"badge g\">Sujet 10</span>Explication de texte · Les mesures pour gérer les problèmes démographiques</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'une campagne de sensibilisation dans ton collège, tu étudies un texte qui propose des mesures pour mieux gérer les problèmes liés à l'évolution démographique.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des mesures proposées pour mieux gérer les problèmes démographiques.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">Pour remédier aux problèmes liés à l'évolution démographique, il faut d'abord informer et sensibiliser : une information, une éducation et une communication sur les dangers d'une croissance démographique sans croissance économique sont nécessaires. Il faut aussi renforcer les soins préventifs, élargir la couverture vaccinale des enfants de moins de cinq ans et lutter contre le paludisme et le sida. La planification familiale doit permettre une taille de famille en équilibre avec les ressources, et les filles doivent être maintenues à l'école. Enfin, de meilleurs plans d'aménagement urbain et la répression de la pollution protégeront le cadre de vie.</div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA4.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique les mesures proposées pour mieux gérer les problèmes démographiques.</li><li>Donne ton point de vue sur le rôle de chacun dans la mise en œuvre de ces mesures.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 4. Il aborde les mesures à prendre pour mieux gérer les problèmes liés à l'évolution démographique.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>L'auteur place l'information en premier : « il faut d'abord informer et sensibiliser », par « une information, une éducation et une communication sur les dangers d'une croissance démographique sans croissance économique ». Il demande ensuite des actions de santé : « renforcer les soins préventifs, élargir la couverture vaccinale des enfants de moins de cinq ans et lutter contre le paludisme et le sida ». Ces mesures réduisent la mortalité infantile et améliorent la santé de la population.</p>\n<p>Il aborde enfin la famille et la ville : « la planification familiale doit permettre une taille de famille en équilibre avec les ressources » et « les filles doivent être maintenues à l'école ». Il termine en proposant « de meilleurs plans d'aménagement urbain et la répression de la pollution » pour protéger le cadre de vie. Ces propositions couvrent ainsi la population, la santé, la famille et l'environnement.</p>\n<div class=\"lab\">Conclusion (opinion)</div>\n<p>À notre avis, chacun a un rôle à jouer : l'État doit financer la santé, l'éducation et l'aménagement, les collectivités doivent faire appliquer les plans d'urbanisme, les familles doivent adopter la planification familiale et les élèves peuvent sensibiliser leur entourage. C'est par cette responsabilité partagée que le Bénin atteindra un développement durable.</p>\n</div></details>"};
const BEPC_NAV={"meth":[["format","Format"],["diss","Dissertation"],["et","Explication"],["maj","Actualisation"]],"sa1":[["s1","1"],["s2","2"],["s3","3"],["s4","4"],["s5","5"],["s6","6"],["s7","7"],["s8","8"],["s9","9"],["s10","10"]],"sa2":[["s1","1"],["s2","2"],["s3","3"],["s4","4"],["s5","5"],["s6","6"],["s7","7"],["s8","8"],["s9","9"],["s10","10"]],"sa3":[["s1","1"],["s2","2"],["s3","3"],["s4","4"],["s5","5"],["s6","6"],["s7","7"],["s8","8"],["s9","9"],["s10","10"]],"sa4":[["s1","1"],["s2","2"],["s3","3"],["s4","4"],["s5","5"],["s6","6"],["s7","7"],["s8","8"],["s9","9"],["s10","10"]]};
function epSeg(){const a=[["sa1","SA1 · 10 sujets"],["sa2","SA2 · 10 sujets"],["sa3","SA3 · 10 sujets"],["sa4","SA4 · 10 sujets"],["meth","Méthodes"]];return `<div class="seg">${a.map(([k,l])=>`<button data-m="${k}" class="${S.epMode===k?"on":""}">${l}</button>`).join("")}</div>`;}
function epSegBind(m){m.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.epMode=b.dataset.m;S.epSa=null;S.epOpen=null;render();window.scrollTo(0,0);});}
function vBepc(m){
  const k=S.epMode;
  if(k!=="sa1"&&!acces()){gate(m,epSeg(),null);epSegBind(m);return;}
  m.innerHTML=epSeg()+`<div class="chips">${BEPC_NAV[k].map(([id,l])=>`<button data-id="${id}">${l}</button>`).join("")}</div><div class="bepc">${BEPC[k]}</div>`;
  epSegBind(m);

}
function vEpreuves(m){vBepc(m);}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(i){const qs=shuffle(SA[i].quiz).map(q=>{const idx=shuffle(q.o.map((t,k)=>k));return{q:q.q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a),e:q.e};});S.quiz={sa:i,qs,i:0,sc:0,pick:null,done:false};}
function vQuiz(m){
  if(!S.quiz){const sc=jget("scores4e_v2",{});saList(m,"Quiz","15 questions par SA, correction immédiate."+(Object.keys(sc).length?" Meilleurs scores : "+SA.map(s=>sc[s.id]!==undefined?"SA"+s.id+" "+sc[s.id]+"/"+s.quiz.length:"").filter(Boolean).join(" · "):""),i=>startQuiz(i));return;}
  const q=S.quiz,s=SA[q.sa];
  if(!libre(q.sa)){gate(m,"",()=>{S.quiz=null});return;}
  if(q.done){
    const sc=jget("scores4e_v2",{});if(sc[s.id]===undefined||q.sc>sc[s.id]){sc[s.id]=q.sc;sset("scores4e_v2",JSON.stringify(sc));}
    const msg=q.sc>=7?"Excellent travail !":q.sc>=5?"Bien, continue à réviser les points manqués.":"Relis la fiche de cette SA puis recommence.";
    m.innerHTML=`<div class="card" style="text-align:center"><span class="badge">SA${s.id} · ${esc(s.court)}</span><h2 style="margin:12px 0 4px;font-size:34px">${q.sc} / ${q.qs.length}</h2><p>${msg}</p></div>
    <button class="btn" id="re">Recommencer ce quiz</button><div style="height:10px"></div><button class="btn alt" id="fi">Relire la fiche</button><div style="height:10px"></div><button class="btn alt" id="all">Choisir une autre SA</button>`;
    $("#re").onclick=()=>{startQuiz(q.sa);render();};$("#fi").onclick=()=>{S.tab="fiches";S.sa=q.sa;S.quiz=null;render();window.scrollTo(0,0);};$("#all").onclick=()=>{S.quiz=null;render();};return;
  }
  const c=q.qs[q.i];const pk=q.pick;
  m.innerHTML=`<button class="back" id="bk">‹ Quitter le quiz</button>
  <div class="small">SA${s.id} · question ${q.i+1} sur ${q.qs.length} · score ${q.sc}</div>
  <div class="prog"><i style="width:${(q.i/q.qs.length)*100}%"></i></div>
  <h3 style="font-size:18px;margin:0 0 12px">${esc(c.q)}</h3>
  ${c.o.map((t,k)=>`<button class="opt ${pk!==null?(k===c.a?"good":(k===pk?"bad":"")):""}" data-k="${k}" ${pk!==null?"disabled":""}>${esc(t)}</button>`).join("")}
  ${pk!==null?`<div class="box"><b class="ui">${pk===c.a?"Bonne réponse. ":"Mauvaise réponse. "}</b>${esc(c.e)}</div><button class="btn" id="nx">${q.i+1<q.qs.length?"Question suivante":"Voir mon score"}</button>`:""}`;
  $("#bk").onclick=()=>{S.quiz=null;render();};
  m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(q.pick!==null)return;q.pick=+b.dataset.k;if(q.pick===c.a)q.sc++;render();});
  const nx=$("#nx");if(nx)nx.onclick=()=>{q.pick=null;q.i++;if(q.i>=q.qs.length)q.done=true;render();window.scrollTo(0,0);};
}

function vReviser(m){
  const s=SA[S.fcSa];const f=s.fc[S.fcI];
  if(!libre(S.fcSa)){gate(m,`<h2 class="sa-title">Réviser</h2><div class="seg">${SA.map((x,i)=>`<button data-i="${i}" class="${i===S.fcSa?"on":""}">SA${x.id}${i>0&&!acces()?" 🔒":""}</button>`).join("")}</div>`,null);m.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.fcSa=+b.dataset.i;S.fcI=0;S.fcShow=false;render();});return;}
  m.innerHTML=`<h2 class="sa-title">Réviser</h2>
  <div class="seg">${SA.map((x,i)=>`<button data-i="${i}" class="${i===S.fcSa?"on":""}">SA${x.id}</button>`).join("")}</div>
  <p class="small">${esc(s.court)} · carte ${S.fcI+1} sur ${s.fc.length}. Touche la carte pour voir la réponse.</p>
  <div class="fc ${S.fcShow?"ans":""}" id="card" role="button" tabindex="0">${esc(S.fcShow?f[1]:f[0])}</div>
  <div class="row"><button class="btn alt sm" id="pv" style="flex:1">Précédente</button><button class="btn sm" id="nx" style="flex:1">Suivante</button></div>
  <h3 style="margin:18px 0 6px;font-size:16px">L'essentiel de la SA${s.id}</h3>
  <div class="card"><ul class="pts">${s.fc.map(x=>`<li><b>${esc(x[0])}</b> ${esc(x[1])}</li>`).join("")}</ul></div>`;
  m.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.fcSa=+b.dataset.i;S.fcI=0;S.fcShow=false;render();});
  const flip=()=>{S.fcShow=!S.fcShow;render();};$("#card").onclick=flip;$("#card").onkeydown=e=>{if(e.key==="Enter"||e.key===" ")flip();};
  $("#nx").onclick=()=>{S.fcI=(S.fcI+1)%s.fc.length;S.fcShow=false;render();};
  $("#pv").onclick=()=>{S.fcI=(S.fcI-1+s.fc.length)%s.fc.length;S.fcShow=false;render();};
}
