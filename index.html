 fil directeur ; ce n'est pas une reformulation du sujet.</td><td>Lire la <b>tâche</b>, le contexte et surtout les consignes. Elle s'écrit sous <b>forme affirmative</b> : une phrase qui dit le problème posé par le sujet.</td></tr>\n<tr><td><b>Annonce du plan</b></td><td>Dire au correcteur ce qu'il trouvera dans le corps du devoir.</td><td>Au choix, une seule forme : <b>affirmative</b> (« Notre devoir consistera à présenter d'abord…, ensuite à décrire…, enfin à donner… ») ou <b>interrogative</b> (questions qui reprennent les consignes). Garder les verbes d'habileté des consignes.</td></tr>\n</table></div>\n\n<h3>B. Le corps du devoir</h3>\n<ul>\n<li>Il suit les consignes : <b>trois questions, trois paragraphes</b> (ou plus si le contenu l'exige).</li>\n<li>Commencer par une <b>phrase introductive</b>, puis répondre à la première question.</li>\n<li>Terminer chaque paragraphe par une <b>phrase de transition</b> qui relie la réponse donnée à celle qui suit (obligatoire entre la première et la deuxième question). Dans les corrigés de l'application, les transitions sont mises <b>en gras</b>.</li>\n<li>Chaque réponse s'appuie sur des éléments précis du cours : noms, dates, lieux, exemples.</li>\n</ul>\n\n<h3>C. La conclusion</h3>\n<p>Elle n'est pas un résumé : c'est un <b>bilan</b> qui répond à la problématique, suivi d'une <b>ouverture</b> vers un autre problème qu'on se contente d'évoquer. Elle reprend en sens inverse les éléments de l'introduction et reste courte.</p>\n\n<div class=\"box key\"><div class=\"t\">Canevas à compléter</div>\n<p><i>Introduction.</i> « … (préambule : contexte, une ou deux phrases). … (problématique : phrase affirmative qui dit le problème posé par le sujet). Notre devoir consistera à … d'abord (consigne 1) …, ensuite à … (consigne 2) …, enfin à … (consigne 3) … » ou, à la place de cette dernière phrase, trois questions qui reprennent les consignes.</p>\n<p><i>Corps.</i> « … (phrase introductive). … (réponse 1). <b>… (transition)</b>. … (réponse 2). <b>… (transition)</b>. … (réponse 3). »</p>\n<p><i>Conclusion.</i> « Au total, … (bilan : réponse à la problématique). … (ouverture). »</p></div>\n\n<div class=\"box\"><div class=\"t\">Erreurs fréquentes</div>\nMettre des tirets ou des lignes sautées · oublier la problématique ou le plan · reformuler le sujet au lieu de poser la problématique · écrire à la fois les questions et la phrase d'annonce du plan · enchaîner les réponses sans transition · résumer au lieu de faire un bilan · rester vague, sans dates ni noms.</div>\n\n<h2 id=\"et\">3. Méthode de l'explication de texte</h2>\n<p>L'explication de texte consiste à expliquer les idées d'un auteur grâce aux éléments du cours. Elle comporte trois parties qui répondent aux trois consignes. <b>On ne met jamais le numéro des consignes dans la rédaction.</b></p>\n\n<h3>A. L'introduction ou présentation du texte (consigne 1)</h3>\n<ul>\n<li><b>La source :</b> titre de l'ouvrage, nom de l'auteur, maison d'édition, année de parution, page. Ces éléments figurent souvent au bas du texte. <b>Il ne faut jamais en inventer</b> : si un élément manque, on ne le cite pas. Un texte peut avoir deux sources ou plus (site internet : adresse et date de consultation).</li>\n<li><b>L'idée générale :</b> le fait central, ce dont parle essentiellement le texte.</li>\n<li><b>Interdit :</b> annoncer le plan et poser une problématique, formellement exclus ici.</li>\n</ul>\n<div class=\"box key\"><div class=\"t\">Formules et canevas</div>\n<p>« Le texte soumis à notre réflexion… » · « Le texte que nous avons à expliquer… » · « Le texte, objet de notre explication… »</p>\n<p>après la source, l'idée générale commence par « Il met en exergue… » · « Il met en relief… » · « Il aborde… » · « Il insiste sur… »</p>\n<p><i>Canevas :</i> « Le texte soumis à notre réflexion est tiré de … (titre) … et écrit par … (auteur). Il a été édité par … (maison d'édition) … en … (année) … et est tiré de la page … Il met en exergue … (idée générale : le thème et ce que l'auteur en dit). »</p></div>\n\n<h3>B. Le corps du devoir (consigne 2)</h3>\n<ul>\n<li>Une seule partie, en Histoire comme en Géographie.</li>\n<li>On explique les affirmations de l'auteur par une rédaction cohérente et argumentée, appuyée sur le cours.</li>\n<li>On utilise <b>au moins deux phrases ou citations du texte</b>, mises entre guillemets, puis expliquées avec ses propres connaissances.</li>\n<li>On ne recopie <b>jamais</b> tout le texte.</li>\n</ul>\n\n<h3>C. La conclusion (consigne 3)</h3>\n<div class=\"scroll\"><table>\n<tr><th></th><th>Histoire</th><th>Géographie</th></tr>\n<tr><td>Ce qu'on donne</td><td><b>L'intérêt du texte</b> : la pertinence des idées de l'auteur, ce qu'on a gagné en étudiant le texte.</td><td><b>Son opinion</b> : sa position (pour ou contre, vrai ou faux) suivie d'une brève justification.</td></tr>\n<tr><td>Formules</td><td>« Le texte, objet de notre explication, est digne d'intérêt parce qu'il nous a permis de mieux comprendre… » · « Le texte de … est d'un intérêt historique appréciable parce qu'il nous a permis d'avoir une idée plus claire de… »</td><td>« Nous pensons que… », « Nous sommes d'accord / en désaccord avec l'auteur, parce que… »</td></tr>\n</table></div>\n<p><b>Règles :</b> la conclusion ne doit pas dépasser l'introduction ; en Géographie, donner son opinion n'est pas faire une dissertation.</p>\n\n<div class=\"box\"><div class=\"t\">Dissertation et explication de texte : l'essentiel</div>\n<div class=\"scroll\"><table>\n<tr><th></th><th>Dissertation</th><th>Explication de texte</th></tr>\n<tr><td>Introduction</td><td>Préambule + problématique + annonce du plan</td><td>Source + idée générale seulement</td></tr>\n<tr><td>Corps</td><td>Un paragraphe par consigne, avec transitions</td><td>Une seule partie, au moins 2 citations expliquées</td></tr>\n<tr><td>Conclusion</td><td>Bilan + ouverture</td><td>Intérêt (Histoire) ou opinion (Géographie)</td></tr>\n<tr><td>Interdits</td><td>Tirets, astérisques, lignes vides</td><td>Plan, problématique, numéros de consignes, recopie du texte</td></tr>\n</table></div></div>\n\n<h2 id=\"maj\">4. Actualisation et points de vigilance</h2>\n<div class=\"warn\">\n<ul>\n<li><b>Rwanda (SA3) :</b> le président Juvénal Habyarimana, dont l'avion est abattu le 6 avril 1994, était <b>hutu</b>. La fiche de cours d'origine le présentait à tort comme tutsi : l'erreur est corrigée dans les fiches et les corrigés de l'application. Les estimations du nombre de victimes varient selon les sources ; la fiche retient « près d'un million de personnes en cent jours ».</li>\n<li><b>Traite transatlantique (SA1) :</b> retiens les repères de la fiche : Congrès de Vienne 1815, Kutonu port clandestin à partir de 1830, abolition anglaise de l'esclavage 1833, décret Schœlcher 27 avril 1848. En complément, l'Angleterre avait déjà interdit la traite en 1807 ; la date de la fin de la traite clandestine varie selon les sources (la fiche parle de 1815 à 1865 environ). Les noms de rois et leurs dates de règne peuvent différer d'un ouvrage à l'autre : suis toujours ta fiche.</li>\n<li><b>Démographie (SA4) :</b> la fiche donne 9 983 884 habitants en 2013 ; les résultats définitifs du recensement de 2013 indiquent 10 008 749 habitants, et le pays compte environ 15 millions d'habitants en 2026 (projections de l'ONU). Les taux de natalité (49 ‰), de mortalité (19 ‰) et d'accroissement naturel (3 %) sont ceux de la fiche pour 2012 et 2002-2013 : dans une copie, utilise les données que le sujet te donne ; sinon, cite celles de ta fiche en précisant la date.</li>\n<li><b>Milieux naturels (SA2) :</b> les longueurs des fleuves et les superficies des lacs sont celles de la fiche. Certains ouvrages donnent des valeurs voisines. L'état des barrages (Adjarala en projet, Bétérou sur l'Ouémé) est à vérifier auprès de sources récentes.</li>\n<li><b>Sujets d'entraînement :</b> ils sont proposés pour la révision ; les corrigés sont des propositions, non des corrigés officiels. Les textes sont des textes d'entraînement inspirés des supports de la fiche. En situation d'évaluation, la source figure sous le texte : ne jamais l'inventer.</li>\n</ul>\n</div>\n<footer>Document préparé à partir de la fiche de suivi de la progression 2026-2027, des fiches de séquence et des supports de la classe de 4e fournis.</footer>\n","sa1":"<p class=\"sub\">Histoire · 5 dissertations et 5 explications de texte · format béninois : contexte d'évaluation, tâche, consigne</p>\n<div class=\"box\"><b>Rappel.</b> Chaque consigne ne porte que sur un seul volet : une consigne, un paragraphe ; une dissertation compte au plus trois consignes. <i>Dissertation :</i> introduction en un seul bloc (préambule, problématique affirmative, annonce du plan en questions ou sous forme affirmative) ; un paragraphe par consigne, reliés par des phrases de transition en gras ; conclusion (bilan et ouverture) ; ni tirets, ni astérisques dans la rédaction. <i>Explication de texte :</i> introduction = source + idée générale introduite par « il met en exergue / en relief… », « il aborde… » ou « il insiste sur… » ; corps = réponse à la consigne 2 appuyée sur au moins trois extraits entre guillemets ; conclusion = en Histoire, l'intérêt du texte. Les textes sont des textes d'entraînement : à l'examen, la source figure sous le texte, ne l'invente jamais.</div>\n<div class=\"box rule\"><b>Attention aux dates.</b> Découverte de l'Amérique : 12 octobre 1492. Forts de Ouidah : 1671. Agadja : 1708-1740 ; annexions du Danxomè : Allada 1724, Savi 1727, Djèkin 1732, Ouidah 1741. Kpingla : 1774-1789. Convention nationale : 4 février 1794. Congrès de Vienne : 1815. Ghézo : 1818-1858 ; Kutonu : 1830. Abolition anglaise : 1833. Décret Schœlcher : 27 avril 1848. Conférence de Cotonou : décembre 1999. Loi Taubira : 21 mai 2001.</div>\n\n<h2 id=\"s1\"><span class=\"badge\">Sujet 1</span>Dissertation · Les causes et l'organisation de la traite</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre des activités du club d'histoire de ton collège, ton professeur te demande de présenter la traite transatlantique à tes camarades.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente des causes et de l'organisation de la traite transatlantique.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Explique les causes de la traite transatlantique.</li><li>Décris l'organisation du commerce triangulaire.</li><li>Présente les conditions qui ont favorisé la traite en Afrique.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>Du XVIe au XIXe siècle, l'Afrique voit partir vers l'Amérique des millions de ses fils et de ses filles : cette déportation massive d'Africains noirs, employés comme esclaves, est la traite transatlantique, ou commerce triangulaire. Née de la mise en valeur de l'Amérique et des besoins de l'Europe, la traite transatlantique repose sur une organisation précise et sur des conditions favorables en Afrique. Notre devoir consistera à expliquer les causes de la traite, à décrire le commerce triangulaire, puis à présenter les conditions qui l'ont favorisée en Afrique.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Les causes de la traite sont d'abord liées à la découverte de l'Amérique par Christophe Colomb le 12 octobre 1492 : ce continent riche en mines et en terres fertiles exige une main-d'œuvre abondante. L'Europe a ensuite besoin de produits tropicaux (café, cacao, canne à sucre, tabac) et de métaux précieux que son climat et son sous-sol ne lui fournissent pas. Enfin, les Amérindiens, décimés par le travail forcé et les épidémies, ne suffisent plus, et les Européens se tournent vers l'Afrique. <b>Pour répondre à ces besoins, un circuit commercial précis a été mis en place.</b></p>\n<p>Ce circuit comporte quatre étapes. En Europe, des compagnies maritimes chargent dans de grands ports (Nantes, Liverpool, Lisbonne) des navires de pacotilles : armes à feu, alcool, miroirs et tissus. En Afrique, ces marchandises sont échangées dans les comptoirs contre des captifs pris lors des razzias et des guerres ; des médecins retiennent des jeunes de 18 à 25 ans, robustes. Marqués au fer et enchaînés, les captifs traversent l'océan dans des conditions épouvantables avant d'être vendus aux enchères aux planteurs et aux propriétaires de mines. Enfin, les navires reviennent en Europe chargés de produits tropicaux vendus très cher, et le cycle recommence. <b>Ce circuit n'aurait pas fonctionné sans des conditions favorables en Afrique même.</b></p>\n<p>L'esclavage existait déjà en Afrique : prisonniers de guerre, criminels et débiteurs insolvables travaillaient aux champs ou dans les maisons. Les traites transsaharienne et orientale, menées par les Arabes, avaient déjà habitué certaines sociétés à ce commerce. Des royaumes organisés, comme le Danxomè, société pyramidale dirigée par le roi, disposaient de l'autorité et de l'armée nécessaires pour capturer des captifs, et leurs souverains étaient attirés par les produits européens, notamment les armes à feu. Enfin, les négriers préféraient les Noirs, robustes et habitués à un climat semblable à celui de l'Amérique.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Née de la mise en valeur de l'Amérique et des besoins de l'Europe, la traite transatlantique s'est appuyée sur un commerce triangulaire bien organisé et sur des conditions favorables en Afrique. Comment les royaumes côtiers du Bénin ont-ils participé à ce trafic ?</p>\n</div></details>\n\n<h2 id=\"s2\"><span class=\"badge\">Sujet 2</span>Dissertation · Ouidah et la route de l'esclave</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Lors d'une visite de la route de l'esclave à Ouidah organisée par ton collège, le guide te demande de présenter la participation de cette ville à la traite.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente de la participation de Ouidah à la traite transatlantique.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Explique le rôle de Ouidah dans la traite.</li><li>Décris les étapes de la route de l'esclave à Ouidah.</li><li>Montre comment Ouidah est passée sous le contrôle du Danxomè.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>Sur la côte du golfe du Bénin, la ville de Ouidah, ancien Gléxwé, est aujourd'hui un haut lieu de mémoire de la traite transatlantique. Port d'embarquement majeur, elle a joué un rôle central dans le trafic des esclaves, qui suivaient une route aux étapes bien connues avant que la ville ne passe sous le contrôle du Danxomè. Notre devoir consistera à expliquer le rôle de Ouidah dans la traite, à décrire les étapes de la route de l'esclave, puis à montrer comment la ville est tombée sous la domination du Danxomè.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Après l'implantation des forts européens en 1671, Ouidah devient l'un des principaux points d'embarquement des esclaves vers l'Amérique et l'interface commerciale entre les négriers et le royaume d'Abomey. Les esclaves y sont rassemblés sur la place Chacha pour être vendus, sous le contrôle du roi. Sous Kpingla (1774-1789), la traite y est même érigée en monopole royal, et des négriers comme Francisco Félix de Souza y font fortune. <b>Cette activité intense a laissé dans la ville un parcours devenu célèbre, la route de l'esclave.</b></p>\n<p>Les captifs venus d'Abomey empruntaient un itinéraire d'environ cent quarante kilomètres, par Kana, Zogbodomey, Toffo, Allada et Savi. À Ouidah, ils passaient d'abord à la place Chacha, où ils étaient vendus, puis tournaient autour de l'arbre de l'oubli, neuf fois pour les hommes et sept fois pour les femmes, pour oublier leur passé et leur identité. Ils étaient ensuite enfermés à la place Zomaï ; les malades et les mourants étaient jetés dans la fosse de Zoungbodji. Après l'arbre du retour, autour duquel ils tournaient trois fois pour que leur souffle revienne après leur mort, ils franchissaient la porte du non-retour avant l'embarquement à la plage de Djègbadji. <b>Mais Ouidah n'est pas restée longtemps indépendante.</b></p>\n<p>Le Danxomè, établi sur le plateau d'Abomey, n'a pas d'accès à la mer et doit payer une taxe, le dénou, aux royaumes côtiers intermédiaires. Pour y échapper et contrôler la traite, ses rois étendent leur domination vers la côte : Agadja annexe Allada en 1724, Savi en 1727 et Djèkin en 1732, puis Tégbessou conquiert Ouidah en 1741. Le roi y place un Yovogan, chargé des relations avec les Blancs, du regroupement des esclaves et du prélèvement des taxes.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Principal port de la traite au Bénin, Ouidah a connu l'essor du commerce négrier avant de passer sous le contrôle du Danxomè en 1741. Ce passé douloureux a fait de la route de l'esclave un lieu de mémoire que le pays doit préserver.</p>\n</div></details>\n\n<h2 id=\"s3\"><span class=\"badge\">Sujet 3</span>Dissertation · Le royaume de Xogbonou et la traite</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Pour préparer un exposé sur le patrimoine de Porto-Novo, des élèves de ta classe veulent comprendre comment ce royaume a participé à la traite.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente de la participation du royaume de Xogbonou à la traite transatlantique.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Décris le fonctionnement de la traite à Xogbonou.</li><li>Décris l'évolution de la traite dans ce royaume.</li><li>Dégage les conséquences de la traite à Xogbonou.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>Situé au sud-est du Bénin, dans l'actuel département de l'Ouémé, l'ancien royaume de Xogbonou, devenu Porto-Novo, entre dans la traite plus tard que ses voisins. Sa participation, brève mais intense, présente une particularité d'organisation et laisse des traces profondes. Notre devoir consistera à décrire le fonctionnement de la traite dans le royaume, puis son évolution, enfin à dégager ses conséquences.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>La traite commence dans le royaume sous le roi Dèmeyi (1752-1757), lorsque le Portugais Domingo propose des cadeaux en échange d'esclaves. Les esclaves sont obtenus par la ruse, par les razzias ou par héritage, puis vendus au marché Ogagbami, près du palais royal de Honmè, par troc ou parfois contre de la monnaie. L'embarquement se fait sur la lagune, par Odo Oba, et sur l'océan, à Ekpè et à Okoun-Sèmè. Contrairement au Danxomè, le commerce n'est ni centralisé ni contrôlé par la cour : chacun peut acheter et vendre librement, sans payer de droits au roi. <b>Ce fonctionnement évolue ensuite selon les règnes.</b></p>\n<p>La traite s'intensifie sous Dê Houffon (1794-1807), devient clandestine sous Dê Sodji (1848-1861) lorsqu'elle est interdite, puis décline dès l'avènement de Dê Mikpon (1861-1872). <b>Cette évolution a eu des répercussions durables sur le royaume.</b></p>\n<p>Sur le plan politique, Xogbonou dépend d'Oyo jusqu'en 1820 pour se protéger du Danxomè, et signe un traité de protectorat avec les Français sous Dê Sodji. Sur le plan social, il accueille des esclaves yoruba, voit se rompre des amitiés entre royaumes voisins et reçoit les Afro-brésiliens, placés dans l'administration. Sur le plan économique, les hauts dignitaires s'enrichissent, des maisons de commerce européennes s'installent et de nouvelles plantes apparaissent : tomate, haricot, maïs, palmier à huile. Sur le plan culturel, l'islam et le christianisme gagnent du terrain, et de nouvelles habitudes culinaires, ludiques et architecturales s'installent.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Entré tard dans la traite, le royaume de Xogbonou l'a pratiquée librement, sans monopole royal, avec des conséquences politiques, sociales, économiques et culturelles profondes. Comment le Danxomè, voisin puissant, a-t-il lui aussi participé à ce trafic ?</p>\n</div></details>\n\n<h2 id=\"s4\"><span class=\"badge\">Sujet 4</span>Dissertation · Le Danxomè dans la traite</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Lors d'une visite des palais royaux d'Abomey, le guide te demande d'expliquer comment le Danxomè, royaume de l'intérieur, a pris part à la traite transatlantique.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente de la participation du Danxomè à la traite.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Explique la conquête des royaumes côtiers par le Danxomè.</li><li>Décris l'évolution de la traite au Danxomè jusqu'au règne de Ghézo.</li><li>Présente les conséquences de la traite pour le Danxomè.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>Royaume de l'intérieur, établi sur le plateau d'Abomey, le Danxomè est devenu l'une des grandes puissances négrières de la côte du golfe du Bénin. Pour participer au trafic, il a conquis les royaumes du littoral, puis il a su s'adapter à la fin de la traite, mais celle-ci a laissé des conséquences durables. Notre devoir consistera à expliquer la conquête de la côte par le Danxomè, à décrire l'évolution de la traite jusqu'à Ghézo, puis à présenter ses conséquences.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Sans accès direct à la mer, le Danxomè doit passer par Allada, Savi et Ouidah et leur payer une taxe, le dénou. Pour y échapper, contrôler la traite et se procurer des armes à feu, ses rois décident de conquérir la côte ; ils font aussi la guerre aux Mahi, aux Yoruba et aux Nago pour se procurer des captifs. Agadja prend Allada en 1724, Savi en 1727 et Djèkin en 1732 ; Tégbessou conquiert Ouidah en 1741. Le roi nomme alors un Yovogan à Ouidah, qui règle les relations avec les Blancs et prélève les taxes. Après ces conquêtes, la traite devient une activité de la famille royale. <b>Cette activité se poursuit ensuite au fil des règnes.</b></p>\n<p>Sans difficulté jusqu'à la fin du XVIIIe siècle, la traite se poursuit sous Ghézo (1818-1858), aidé de Francisco Félix de Souza. Mais le Congrès de Vienne (1815) en a décidé l'abolition ; la traite devient clandestine et utilise le port de Kutonu à partir de 1830. Ghézo encourage alors le palmier à huile, le manioc et le maïs, ce qui permet au Danxomè de survivre à la fin de la traite, contrairement à Ouidah, Allada et Savi. <b>Ces transformations ont eu des conséquences multiples sur le royaume.</b></p>\n<p>Sur le plan économique, la traite ruine l'agriculture, la pêche et l'artisanat traditionnels, mais enrichit le royaume par les taxes ; de nouvelles cultures apparaissent. Sur le plan politique, l'armée est renforcée, le corps des amazones est créé et les royaumes de la côte disparaissent. Sur le plan social, les régions voisines sont dépeuplées et leurs habitants se réfugient dans des villages lacustres comme Ganvié ou sur les collines de Dassa, de Savè et de Savalou. Sur le plan culturel, de nouvelles traditions ludiques et architecturales, des plats nouveaux et des danses venues d'Amérique apparaissent.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Pour s'ouvrir à la mer et profiter de la traite, le Danxomè a conquis les royaumes côtiers, puis a reconverti son économie avec Ghézo, au prix de conséquences lourdes pour ses voisins. Ces blessures de l'histoire expliquent en partie les débats actuels sur la mémoire de la traite.</p>\n</div></details>\n\n<h2 id=\"s5\"><span class=\"badge\">Sujet 5</span>Dissertation · L'abolition de la traite et les débats actuels</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>À l'occasion de la journée du souvenir de la traite, ton professeur t'invite à présenter la fin du trafic et la façon dont on en parle aujourd'hui.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente de l'abolition de la traite et des débats actuels.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Retrace les grandes étapes de l'abolition de la traite.</li><li>Explique comment le Danxomè s'adapte à la fin de la traite.</li><li>Présente les deux positions du débat actuel sur la traite.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>La traite transatlantique ne s'est pas arrêtée d'un seul coup : son abolition s'étale sur plus d'un demi-siècle, et ses conséquences nourrissent encore des débats. L'abolition, l'adaptation des royaumes qui vivaient de la traite et les discussions actuelles entre revendication et réconciliation forment les trois temps de cette histoire. Notre devoir consistera à retracer les étapes de l'abolition, à expliquer l'adaptation du Danxomè, puis à présenter les deux positions du débat actuel.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Le 4 février 1794, la Convention nationale française abolit l'esclavage dans les colonies, mais le négoce obtient de revenir sur cette décision. En 1815, le Congrès de Vienne décide l'abolition de la traite. L'Angleterre abolit l'esclavage en 1833. Enfin, le 27 avril 1848, Victor Schœlcher, sous-secrétaire d'État aux colonies de la IIe République, obtient le décret qui abolit l'esclavage dans les colonies françaises. Pour trouver de la main-d'œuvre, l'Europe se tourne alors vers d'autres sources et vers la révolution industrielle. <b>Cette fin du trafic oblige les royaumes négriers à changer d'activité.</b></p>\n<p>Au Danxomè, la traite devient clandestine de 1815 à 1865 environ, avec Kutonu comme port depuis 1830. Le roi Ghézo remplace progressivement le commerce des esclaves par celui de l'huile de palme, convertit les populations aux cultures industrielles et développe les cultures vivrières comme le manioc et le maïs. Cette reconversion permet au royaume de survivre, alors que Ouidah, Allada et Savi déclinent avec la fin du trafic. <b>Cet héritage divise aujourd'hui encore les Africains sur la manière de le traiter.</b></p>\n<p>Deux positions s'opposent. La préoccupation revendicative, défendue surtout par les pays anglophones, demande que l'Europe dédommage l'Afrique pour les méfaits de la traite. L'option conciliatrice, soutenue par les pays francophones, préfère le pardon, la repentance et la réconciliation : l'Europe reconnaîtrait sa responsabilité et les Africains présenteraient leurs excuses aux Noirs d'Amérique. Cette voie s'est concrétisée à Cotonou, en décembre 1999, puis par la loi Taubira du 21 mai 2001, qui reconnaît la traite comme crime contre l'humanité.</p>\n<div class=\"lab\">Conclusion</div>\n<p>De l'abolition progressive à l'adaptation du Danxomè, puis aux débats d'aujourd'hui, la traite continue de marquer les mémoires. Quelle place l'enseignement de l'histoire doit-il lui donner pour construire la réconciliation entre les peuples ?</p>\n</div></details>\n\n<h2 id=\"s6\"><span class=\"badge\">Sujet 6</span>Explication de texte · Le commerce triangulaire</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'une recherche sur la traite transatlantique, tu étudies un texte consacré au fonctionnement du commerce triangulaire.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente du fonctionnement du commerce triangulaire.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">Pour rentabiliser leurs voyages, les armateurs européens du XVIIIe siècle organisent un circuit en trois étapes. Leurs navires quittent les grands ports d'Europe chargés d'armes à feu, d'alcool et de verroterie. En Afrique, ils échangent ces marchandises contre des captifs. En Amérique, les captifs sont vendus et, avec l'argent obtenu, les compagnies achètent du sucre, du tabac et du rhum qu'elles ramènent en Europe, où ces produits se vendent très cher. À chaque étape, les commerçants réalisent un bénéfice important.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de Le Callennec (1995).</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique le fonctionnement du commerce triangulaire d'après le texte.</li><li>Dégage l'intérêt de l'étude de ce texte.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré d'un ouvrage de Le Callennec publié en 1995. Il met en exergue le fonctionnement du commerce triangulaire au XVIIIe siècle.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Pour l'auteur, les armateurs européens cherchent d'abord la rentabilité : ils « organisent un circuit en trois étapes » pour que leurs navires ne voyagent jamais à vide. La première étape se déroule en Europe, d'où les navires partent « chargés d'armes à feu, d'alcool et de verroterie », c'est-à-dire de pacotilles destinées à l'Afrique. La deuxième a lieu sur la côte africaine, où les Européens « échangent ces marchandises contre des captifs ». Dans la troisième, les captifs sont vendus en Amérique ; avec l'argent obtenu, les compagnies achètent « du sucre, du tabac et du rhum », ramenés en Europe où ils se vendent très cher.</p>\n<p>L'auteur conclut que « à chaque étape, les commerçants réalisent un bénéfice important ». Le texte montre ainsi que le commerce triangulaire repose sur le profit et que la traite durait parce qu'elle enrichissait les armateurs, au prix de la déportation de millions d'Africains.</p>\n<div class=\"lab\">Conclusion (intérêt du texte)</div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de comprendre comment le commerce triangulaire reliait l'Europe, l'Afrique et l'Amérique et pourquoi les Européens l'ont maintenu pendant trois siècles.</p>\n</div></details>\n\n<h2 id=\"s7\"><span class=\"badge\">Sujet 7</span>Explication de texte · L'expansion du Danxomè vers la côte</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'un exposé sur les royaumes du Bénin, tu étudies un texte qui explique l'expansion du Danxomè vers la côte.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente de l'expansion du Danxomè vers la côte.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">Les campagnes expansionnistes des rois du Danxomè les conduisent à la conquête des royaumes côtiers. Sous le règne d'Agadja, Allada est prise en 1724, Savi en 1727 et Djèkin en 1732. Sous celui de Tégbessou, Ouidah est conquise en 1741. Le Danxomè obtient ainsi un accès à la mer et peut commercer directement avec les négriers et les autres Européens.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de Ramin et al. (1964).</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique l'expansion du Danxomè vers la côte.</li><li>Dégage l'intérêt de l'étude de ce texte.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré d'un ouvrage de Ramin et ses collaborateurs publié en 1964. Il met en relief l'expansion du Danxomè vers la côte et ses résultats.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>L'auteur explique d'abord que « les campagnes expansionnistes des rois du Danxomè » ont une cause : le royaume, établi à l'intérieur des terres, n'a pas d'accès à la mer et doit payer des taxes aux intermédiaires de la côte. Il détaille ensuite les étapes de la conquête : « Allada est prise en 1724, Savi en 1727 et Djèkin en 1732 » sous Agadja, puis, sous Tégbessou, « Ouidah est conquise en 1741 ».</p>\n<p>Le résultat est précisé en fin de texte : le Danxomè obtient « un accès à la mer » et peut « commercer directement » avec les négriers. Il contrôle désormais la traite, nomme un Yovogan à Ouidah et peut acheter des armes à feu et des produits européens sans payer de taxes aux voisins.</p>\n<div class=\"lab\">Conclusion (intérêt du texte)</div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de comprendre pourquoi et comment le Danxomè est devenu un acteur majeur de la traite sur la côte du Bénin.</p>\n</div></details>\n\n<h2 id=\"s8\"><span class=\"badge\">Sujet 8</span>Explication de texte · L'origine des esclaves</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'une recherche sur la traite dans le sud du Bénin, tu étudies un texte consacré à l'origine des esclaves vendus aux négriers.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente de l'origine des esclaves vendus aux Européens.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">Le gros des esclaves provenait de l'autorité politique. Il s'agissait surtout de captifs pris lors des razzias et des guerres menées contre les groupes voisins, notamment les Nago et les Mahi, dont les régions étaient de véritables réservoirs d'esclaves. D'autres esclaves venaient de personnes condamnées pour refus de travailler la terre ou d'enfants vendus par leurs parents en temps de famine. Une fois ramenés dans la capitale, les captifs étaient en partie employés dans les domaines du roi, en partie envoyés à Ouidah pour être vendus aux négriers.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de Iroko (2003).</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique l'origine des esclaves vendus aux négriers.</li><li>Dégage l'intérêt de l'étude de ce texte.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré des travaux de Félix Iroko publiés en 2003. Il aborde l'origine des esclaves vendus aux négriers.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>L'auteur affirme d'abord que « le gros des esclaves provenait de l'autorité politique » : les rois organisaient des guerres pour capturer des hommes et des femmes. Il précise qu'il s'agissait surtout de « captifs pris lors des razzias et des guerres menées contre les groupes voisins », en particulier les Nago et les Mahi, dont les régions sont qualifiées de « véritables réservoirs d'esclaves ». Ces guerres servaient donc à la fois à étendre le royaume et à se procurer des captifs.</p>\n<p>D'autres sources existaient : des personnes condamnées pour refus de travailler la terre et des « enfants vendus par leurs parents en temps de famine ». L'origine des esclaves était donc d'abord politique et guerrière, puis, plus rarement, judiciaire ou familiale.</p>\n<div class=\"lab\">Conclusion (intérêt du texte)</div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de comprendre que les Africains eux-mêmes, et surtout les autorités politiques, ont pris part à la traite, et de mesurer l'ampleur des souffrances qu'elle a causées.</p>\n</div></details>\n\n<h2 id=\"s9\"><span class=\"badge\">Sujet 9</span>Explication de texte · Les conséquences de la traite sur l'Afrique</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'un exposé sur l'histoire de l'Afrique, tu étudies un texte consacré aux conséquences de la traite sur le continent.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des conséquences de la traite sur l'Afrique.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">Le départ de tant d'hommes et de femmes a gravement désorganisé l'économie de l'Afrique. Les négriers choisissaient les personnes les plus valides, celles qui étaient nécessaires au bon fonctionnement de l'économie. De nombreux Africains abandonnèrent leurs activités pour se consacrer au commerce des esclaves, plus lucratif. L'afflux des produits européens concurrença l'artisanat africain et provoqua son déclin. Sur le plan social, la traite enrichit de nouvelles classes de marchands, et les armes à feu se répandirent, provoquant des guerres à répétition.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de Le Callennec (1995).</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique les conséquences de la traite sur l'Afrique d'après le texte.</li><li>Dégage l'intérêt de l'étude de ce texte.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré d'un ouvrage de Le Callennec publié en 1995. Il insiste sur les conséquences économiques et sociales de la traite en Afrique.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Pour l'auteur, le départ des captifs « a gravement désorganisé l'économie de l'Afrique ». Il en donne trois raisons. D'abord, les négriers prenaient « les personnes les plus valides », c'est-à-dire les bras dont dépendaient les champs et les ateliers. Ensuite, de nombreux Africains quittaient leur métier pour le commerce des esclaves, « plus lucratif ». Enfin, les produits européens « concurrença l'artisanat africain et provoqua son déclin ».</p>\n<p>Sur le plan social, la traite fait naître de nouvelles classes de marchands, et les armes à feu qui se répandent provoquent « des guerres à répétition ». Le texte montre ainsi que la traite a appauvri le continent, dépeuplé des régions entières et installé durablement la violence.</p>\n<div class=\"lab\">Conclusion (intérêt du texte)</div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mesurer les conséquences de la traite sur le développement de l'Afrique et de comprendre pourquoi elle porte encore aujourd'hui le poids de cette histoire.</p>\n</div></details>\n\n<h2 id=\"s10\"><span class=\"badge\">Sujet 10</span>Explication de texte · Le débat actuel sur la traite</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'un débat organisé dans ton collège, tu étudies un texte consacré aux positions actuelles sur les séquelles de la traite.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente du débat actuel sur la traite transatlantique.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">En septembre 2001, la conférence mondiale des Nations unies contre le racisme se tient à Durban, en Afrique du Sud. Plusieurs pays y demandent que la question du dédommagement des séquelles de la traite soit inscrite à l'ordre du jour. Leur position se résume ainsi : la traite a enrichi les négriers et appauvri l'Afrique, qui doit donc être dédommagée. Les pays francophones sont en général moins attachés au dédommagement financier, qu'ils jugent humiliant, tout en reconnaissant un crime contre l'humanité. Beaucoup préfèrent la repentance et la réconciliation.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de Iroko (2003).</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique les deux positions qui s'opposent dans le débat actuel.</li><li>Dégage l'intérêt de l'étude de ce texte.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré des travaux de Félix Iroko publiés en 2003. Il met en exergue les deux positions qui s'opposent aujourd'hui sur les séquelles de la traite transatlantique.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>L'auteur situe d'abord le débat : « la conférence mondiale des Nations unies contre le racisme se tient à Durban », en septembre 2001. Plusieurs pays y défendent la position revendicative, qui se résume ainsi : « la traite a enrichi les négriers et appauvri l'Afrique », laquelle doit donc être dédommagée.</p>\n<p>Face à eux, les pays francophones jugent le dédommagement financier « humiliant », tout en reconnaissant que la traite est un crime contre l'humanité. Beaucoup préfèrent « la repentance et la réconciliation », c'est-à-dire la reconnaissance des responsabilités, les excuses et le pardon entre Européens, Africains et Noirs d'Amérique. Les deux options s'opposent donc sur les moyens, mais s'accordent pour condamner la traite.</p>\n<div class=\"lab\">Conclusion (intérêt du texte)</div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de comprendre que le débat sur la traite n'est pas clos et d'apprécier les deux voies proposées pour réparer cette histoire douloureuse.</p>\n</div></details>","sa2":"<p class=\"sub\">Géographie · 5 dissertations et 5 explications de texte · format béninois : contexte d'évaluation, tâche, consigne</p>\n<div class=\"box\"><b>Rappel.</b> Chaque consigne ne porte que sur un seul volet : une consigne, un paragraphe ; une dissertation compte au plus trois consignes. <i>Dissertation :</i> introduction en un seul bloc (préambule, problématique affirmative, annonce du plan en questions ou sous forme affirmative) ; un paragraphe par consigne, reliés par des phrases de transition en gras ; conclusion (bilan et ouverture) ; ni tirets, ni astérisques dans la rédaction. <i>Explication de texte :</i> introduction = source + idée générale introduite par « il met en exergue / en relief… », « il aborde… » ou « il insiste sur… » ; corps = réponse à la consigne 2 appuyée sur au moins trois extraits entre guillemets ; conclusion = en Géographie, ton opinion justifiée. Les textes sont des textes d'entraînement : à l'examen, la source figure sous le texte, ne l'invente jamais.</div>\n<div class=\"box rule\"><b>Repères à maîtriser.</b> Milieu béninien : de la côte à Savè ; sud-soudanien : de Savè à Bembèrèkè ; nord-soudanien : de Bembèrèkè au Niger ; atacorien : nord-ouest, mont Sagbarao (658 m). Deux bassins : Niger et côtier (ligne de partage : Kopargo, Bembèrèkè, Nikki). Ouémé : 510 km ; Mono : 500 km ; Pendjari : 380 km, qui se jette dans la Volta. Ne confonds pas l'Ouémé (bassin côtier, lac Nokoué) et la Pendjari.</div>\n\n<h2 id=\"s1\"><span class=\"badge g\">Sujet 1</span>Dissertation · Le milieu béninien</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre des activités du club de géographie de ton collège, ton professeur te demande de présenter le milieu naturel dans lequel se trouve le sud du Bénin.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente des atouts et des contraintes du milieu béninien.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente les caractéristiques du milieu béninien.</li><li>Donne ses atouts pour le développement.</li><li>Identifie ses contraintes.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>Situé dans la zone intertropicale, le Bénin s'étire de l'océan Atlantique au fleuve Niger et possède plusieurs milieux naturels. Le milieu béninien, au sud du pays, offre de nombreux atouts pour le développement, mais il subit aussi des contraintes. Notre devoir consistera à présenter les caractéristiques de ce milieu, à relever ses atouts, puis à identifier ses contraintes.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Le milieu béninien, ou milieu subéquatorial, s'étend de la côte jusqu'à la latitude de Savè. Son relief associe la plaine côtière, les plateaux de terre de barre du bas-Bénin et la plaine cristalline. Son climat est chaud et humide, avec des températures de 24 à 26 °C et de 800 à 1 300 mm de pluies par an, réparties en deux saisons des pluies (avril à juillet, octobre à novembre) et deux saisons sèches. Les sols sont variés : sols hydromorphes fertiles, terre de barre, sols ferralitiques. La forêt claire a presque disparu, remplacée par endroits par des plantations de palmiers, de cocotiers et de tecks et par la mangrove. <b>Ces caractéristiques constituent autant d'atouts pour le développement.</b></p>\n<p>Les deux saisons des pluies permettent deux récoltes par an et des cultures variées, favorisées par les sols fertiles et par les vallées irrigables de l'Ouémé et du Mono. La disponibilité de l'eau et du pâturage permet l'élevage du petit bovin de race lagunaire. Les lacs, les lagunes et l'océan Atlantique offrent la pêche et le transport par voie d'eau, et ouvrent le pays au commerce maritime. Les plages de Cotonou, de Ouidah et de Grand-Popo attirent les touristes, et le sous-sol, avec le calcaire d'Onigbolo, l'eau minérale de Possotomè et le sable de verrerie de Houéyogbé, peut stimuler l'industrie. <b>Pourtant, ces richesses sont menacées.</b></p>\n<p>L'homme lui-même fragilise ce milieu : prélèvement abusif du sable marin, surexploitation et encombrement des cours et plans d'eau, feux de végétation, déforestation, rejet anarchique de déchets gazeux et liquides. S'y ajoutent les inondations fréquentes des fleuves, qui endeuillent les populations riveraines.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Chaud, humide et varié, le milieu béninien est riche en atouts agricoles, halieutiques, touristiques et industriels, mais il est menacé par les activités humaines et les inondations. Comment les milieux situés plus au nord complètent-ils ces atouts ?</p>\n</div></details>\n\n<h2 id=\"s2\"><span class=\"badge g\">Sujet 2</span>Dissertation · Le milieu sud-soudanien</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Pour préparer une sortie pédagogique à Dassa-Zoumè, ton professeur te demande de présenter les caractéristiques du milieu naturel de cette région.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente des atouts et des contraintes du milieu sud-soudanien.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente les caractéristiques du milieu sud-soudanien.</li><li>Présente quatre de ses atouts.</li><li>Identifie trois de ses contraintes.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>Au centre du Bénin, entre le sud humide et le nord plus sec, s'étend le milieu sud-soudanien, qui comprend notamment les collines de Dassa, de Savè et de Savalou. Ce milieu présente des atouts réels pour l'économie, mais il est exposé à plusieurs contraintes. Notre devoir consistera à présenter les caractéristiques de ce milieu, à relever ses atouts, puis à identifier ses contraintes.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Le milieu sud-soudanien s'étend de la latitude de Savè à celle de Bembèrèkè. Son relief est peu accidenté : il est dominé par la pénéplaine cristalline, parsemée de quelques collines, et ses sols sont surtout ferrugineux. Les pluies sont abondantes, de 800 à 1 300 mm par an. La végétation est une savane arborée où dominent le néré, le karité, le baobab, le kapokier et le cailcédrat, avec des réserves et des forêts galeries le long des cours d'eau. La faune est riche : buffles, éléphants, girafes, phacochères, antilopes, lions et léopards. <b>Ces caractères offrent plusieurs atouts à la population.</b></p>\n<p>L'abondance des pluies et la variété du climat favorisent des cultures diversifiées, et le pâturage permet l'élevage. L'abondance du bois et des matières premières végétales profite à l'artisanat rural. Les collines de Dassa, de Savè et de Savalou et la faune sont de précieux atouts touristiques. Le sous-sol fournit du marbre à Idadjo, près d'Ouessè, et du granite à Dassa, utilisé pour les routes, les habitations et des ouvrages comme l'épi de Siafato contre l'avancée de l'océan. <b>Mais ce milieu n'est pas exempt de menaces.</b></p>\n<p>Le surpâturage, les feux de végétation, la déforestation et le braconnage dégradent le couvert végétal et appauvrissent la faune. La surexploitation et l'encombrement des cours d'eau, comme le rejet anarchique de déchets, fragilisent les ressources en eau. Enfin, les inondations périodiques de l'Okpara ravagent les champs et les plantations et rendent les déplacements difficiles.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Peu accidenté, bien arrosé, riche en savanes, en faune et en ressources minières, le milieu sud-soudanien est un espace d'avenir pour l'agriculture, l'élevage, le tourisme et les carrières, à condition de lutter contre les feux, le surpâturage et le braconnage. Plus au nord, le milieu nord-soudanien présente d'autres atouts et d'autres contraintes.</p>\n</div></details>\n\n<h2 id=\"s3\"><span class=\"badge g\">Sujet 3</span>Dissertation · Le milieu nord-soudanien</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>À l'occasion d'un concours sur la connaissance du Bénin, on te demande de présenter le milieu naturel du nord du pays, entre Bembèrèkè et le fleuve Niger.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente des atouts et des contraintes du milieu nord-soudanien.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente les caractéristiques du milieu nord-soudanien.</li><li>Donne quatre atouts de ce milieu.</li><li>Identifie ses contraintes.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>Au nord du Bénin, entre Bembèrèkè et le fleuve Niger, s'étend le milieu nord-soudanien, plus sec et plus chaud que le sud du pays. Ce milieu offre des atouts agricoles, touristiques et énergétiques, mais il est menacé par l'avancée du désert et par les activités humaines. Notre devoir consistera à présenter les caractéristiques de ce milieu, à donner ses atouts, puis à identifier ses contraintes.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Le milieu nord-soudanien s'étend de la latitude de Bembèrèkè au fleuve Niger. Son relief est peu accidenté, ce qui facilite les transports terrestres. Les saisons sont bien marquées : une saison sèche de novembre à mai et une saison des pluies de juin à octobre ; l'harmattan y sévit fortement, les températures atteignent 34 °C et il tombe moins de 1 000 mm de pluies par an. La végétation n'est dense que le long des cours d'eau, où l'on trouve la forêt galerie ; ailleurs, c'est une savane arborée et arbustive avec des épineux et des rôniers, ponctuée de plantations de tecks et d'anacardiers. <b>Malgré ces conditions plus rudes, le milieu dispose d'atouts non négligeables.</b></p>\n<p>Les plaines du Borgou sont favorables à la culture du coton, et la diversité climatique permet des cultures variées. Le pâturage et l'eau permettent l'élevage bovin. Le parc national du W et les parcs cynégétiques de la Pendjari et du W offrent des atouts pour le tourisme et la chasse. Le fleuve Niger et ses affluents, le Mékrou, l'Alibori et la Sota, nourrissent la pêche, et des barrages hydroélectriques pourraient être construits sur le Mékrou ; le Niger est navigable de juillet à février. Le sous-sol renferme du fer à Loumbou-Loumbou et à Madikali. <b>Ces atouts restent cependant limités par plusieurs contraintes.</b></p>\n<p>Le surpâturage, la surexploitation des cours d'eau, les feux de végétation, la déforestation et le braconnage dégradent le milieu. L'avancée du désert l'aggrave : les chaleurs augmentent, la saison des pluies se réduit à trois mois, le déboisement progresse et des espèces végétales et animales disparaissent. Enfin, la mouche tsé-tsé et les moucherons, vecteurs de maladies, gênent l'élevage près de certains cours d'eau.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Le milieu nord-soudanien est un grand espace cotonnier, pastoral, touristique et minier, mais il est fragilisé par la sécheresse, l'avancée du désert et les activités humaines. Quels sont les atouts et les contraintes du milieu atacorien, au nord-ouest du pays ?</p>\n</div></details>\n\n<h2 id=\"s4\"><span class=\"badge g\">Sujet 4</span>Dissertation · Le milieu atacorien</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Lors de la préparation d'une excursion à Natitingou, le professeur d'histoire-géographie te demande de présenter le milieu naturel de la région de l'Atacora.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente des atouts et des contraintes du milieu atacorien.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente les caractéristiques du milieu atacorien.</li><li>Présente quatre atouts de ce milieu.</li><li>Identifie trois de ses contraintes.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>Au nord-ouest du Bénin se dresse la chaîne de l'Atacora, qui donne son nom au milieu atacorien. Ce milieu de montagnes offre au pays des atouts remarquables pour le tourisme, l'agriculture et l'énergie, mais il subit des contraintes liées au relief et au climat. Notre devoir consistera à présenter les caractéristiques du milieu, à relever ses atouts, puis à identifier ses contraintes.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Le milieu atacorien se situe dans le nord-ouest du territoire. Il est dominé par une chaîne de montagnes dont le point culminant est le mont Sagbarao, qui atteint 658 mètres. Les pluies orographiques, provoquées par le relief, sont abondantes (1 300 mm par an) et nourrissent une végétation étagée qui recouvre des sols diversifiés, souvent caillouteux et parfois cuirassés. <b>Ces particularités procurent au milieu des atouts importants.</b></p>\n<p>Le parc national de la Pendjari et les chutes de Tanougou et de Kota sont de grands atouts touristiques. L'abondance des pluies, la végétation étagée et les sols variés favorisent des cultures diverses et l'élevage de caprins et de porcins. La Pendjari permet la pêche, conditionne la vie de la faune du parc et offre des zones cynégétiques. Des micro-barrages hydroélectriques peuvent être construits, par exemple à Yéripao, et le sous-sol renferme de l'or à Perma et des pierres ornementales. <b>Mais ce milieu comporte aussi des contraintes.</b></p>\n<p>Les feux de végétation, la déforestation et le braconnage menacent le couvert végétal et la faune. La chaîne de l'Atacora gêne la circulation des personnes. Enfin, la rareté du pâturage et de l'eau en saison sèche oblige les populations à constituer des réserves de foin et à construire des retenues d'eau, tandis que la faune migre ; les inondations périodiques ravagent par ailleurs les champs et les plantations.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Montagneux, bien arrosé, riche en paysages, en faune et en ressources minières, le milieu atacorien est une région d'avenir pour le tourisme et la production, à condition de franchir l'obstacle du relief et de protéger ses ressources. L'ensemble des milieux du pays est irrigué par un réseau hydrographique dont l'utilité est considérable.</p>\n</div></details>\n\n<h2 id=\"s5\"><span class=\"badge g\">Sujet 5</span>Dissertation · Le réseau hydrographique du Bénin</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre de la journée mondiale de l'eau, le club d'environnement de ton collège te demande de présenter les cours d'eau et les plans d'eau du Bénin.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente du réseau hydrographique du Bénin et de son utilité.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Décris le réseau hydrographique du Bénin.</li><li>Explique l'utilité des cours d'eau et des plans d'eau.</li><li>Propose des mesures pour les protéger.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>L'eau est une ressource précieuse pour le développement des pays. Le Bénin possède un réseau hydrographique dense, composé de fleuves, de lacs et de lagunes, d'une grande utilité pour la population, mais qui doit être protégé. Notre devoir consistera à décrire ce réseau, à expliquer son utilité, puis à proposer des mesures de protection.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Le réseau hydrographique, c'est l'ensemble des cours d'eau et des plans d'eau d'une région. Celui du Bénin est divisé en deux grands bassins, le bassin du Niger et le bassin côtier, séparés par une ligne de partage qui passe par Kopargo à l'ouest, Bembèrèkè au centre et Nikki à l'est. Le bassin du Niger est drainé par le Mékrou, l'Alibori et la Sota, affluents du Niger, auxquels s'ajoute la Pendjari, qui prend sa source dans l'Atacora et se jette dans la Volta, au Ghana. Le bassin côtier est drainé par l'Ouémé, plus grand fleuve du pays avec ses 510 kilomètres, par le Couffo et par le Mono. Le long de la côte, un mince cordon littoral sépare l'océan de lacs et de lagunes : les lacs Nokoué, Ahémé et Toho, et les lagunes de Porto-Novo, de Ouidah et de Grand-Popo. <b>Ce réseau rend de multiples services à la population.</b></p>\n<p>La richesse des eaux en poissons rend la pêche fructueuse. Les cours d'eau et les plans d'eau servent de voies de communication, par exemple de Togbin à Grand-Popo et vers le Nigeria, sur le Nokoué et l'Ahémé. Ils favorisent le maraîchage dans les vallées du bas-Ouémé, du Mono et du Niger, l'irrigation (ferme d'Ajara-Hounvè, périmètre sucrier de Savè, périmètres rizicoles des vallées du Niger et de l'Ouémé) et l'élevage. Ils offrent des possibilités hydroélectriques, avec le barrage de Bétérou sur l'Ouémé et celui d'Adjarala en projet sur le Mono, et de tourisme, comme à Ganvié, village lacustre. <b>Pour que ces services durent, il faut préserver ces eaux.</b></p>\n<p>Il convient d'abord d'appliquer les lois qui protègent les cours d'eau et les plans d'eau et de lutter contre leur encombrement et leur surexploitation. Il faut ensuite interdire le rejet anarchique de déchets, reboiser les berges et les bassins versants, et gérer rationnellement les ressources halieutiques. Enfin, les campagnes d'information et de sensibilisation doivent amener les communautés à comprendre les méfaits de la dégradation des eaux.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Réparti entre le bassin du Niger et le bassin côtier, le réseau hydrographique béninois est une richesse pour la pêche, les transports, l'agriculture, l'énergie et le tourisme, mais il exige une protection constante. Les efforts de protection suffiront-ils à préserver ces richesses pour les générations futures ?</p>\n</div></details>\n\n<h2 id=\"s6\"><span class=\"badge g\">Sujet 6</span>Explication de texte · Le climat du Bénin</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'une recherche sur les milieux naturels du Bénin, tu étudies un texte consacré au climat du pays.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente du climat du Bénin.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">Le Bénin est situé dans la zone intertropicale. Son climat est chaud et humide. La mousson, vent humide venu du sud-ouest, apporte la pluie, tandis que l'alizé du nord-est souffle pendant la grande saison sèche. L'allongement du pays en latitude, l'existence de la chaîne de l'Atacora et l'orientation du littoral introduisent des nuances dans ce climat.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de Adam (K. S.) et Boko (M.), Le Bénin, Paris, Edicef, 1983.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique les caractères du climat du Bénin d'après le texte.</li><li>Donne ton point de vue sur l'influence du climat sur les activités économiques du pays.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré d'un ouvrage de K. S. Adam et M. Boko, intitulé « Le Bénin » et publié à Paris, chez Edicef, en 1983. Il met en exergue les caractères du climat du Bénin et les facteurs qui introduisent des nuances.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Les auteurs situent d'abord le pays : le Bénin « est situé dans la zone intertropicale », d'où un climat « chaud et humide ». Ils expliquent ensuite l'alternance des saisons par deux vents : « la mousson, vent humide venu du sud-ouest, apporte la pluie », tandis que « l'alizé du nord-est souffle pendant la grande saison sèche ».</p>\n<p>Ils précisent enfin que ce climat n'est pas uniforme : « l'allongement du pays en latitude, l'existence de la chaîne de l'Atacora et l'orientation du littoral » introduisent des nuances. Ainsi, le sud connaît deux saisons des pluies, le nord une seule, et l'Atacora reçoit des pluies orographiques plus abondantes.</p>\n<div class=\"lab\">Conclusion (opinion)</div>\n<p>À notre avis, le climat est un atout majeur pour l'agriculture béninoise : les pluies, surtout au sud où elles permettent deux récoltes, favorisent des cultures variées. Mais il comporte aussi des risques, comme les inondations au sud et l'harmattan au nord, qui exigent des mesures d'adaptation.</p>\n</div></details>\n\n<h2 id=\"s7\"><span class=\"badge g\">Sujet 7</span>Explication de texte · La diversité des milieux naturels</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Pour un exposé sur la géographie du Bénin, tu étudies un texte qui présente les milieux naturels du pays.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente de la diversité des milieux naturels du Bénin.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">Le Bénin est un pays d'Afrique de l'Ouest, limité au nord par le Niger, au sud par l'océan Atlantique, à l'est par le Nigeria et à l'ouest par le Togo. Des facteurs géographiques déterminent une diversité de milieux, que définit un ensemble de traits physiques : climat, sols, végétation. Le milieu béninien s'étend de la côte jusqu'à la latitude de Savè. Le milieu sud-soudanien va ensuite jusqu'à la latitude de Bembèrèkè, avec des sols ferrugineux et des savanes arborées. Plus au nord, le milieu nord-soudanien s'étend jusqu'au fleuve Niger. Le milieu atacorien couvre le nord-ouest, avec des sols souvent caillouteux.</div>\n<p class=\"src\">Source : texte d'entraînement inspiré de Adam (K. S.) et Boko (M.), Le Bénin, Paris, Edicef, 1983.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique la diversité des milieux naturels du Bénin.</li><li>Donne ton point de vue sur l'intérêt de cette diversité pour le développement du pays.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement inspiré d'un ouvrage de K. S. Adam et M. Boko, intitulé « Le Bénin » et publié à Paris, chez Edicef, en 1983. Il aborde la diversité des milieux naturels du Bénin.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Les auteurs commencent par situer le pays, un État d'Afrique de l'Ouest dont les voisins sont le Niger, l'océan Atlantique, le Nigeria et le Togo. Ils affirment que « des facteurs géographiques déterminent une diversité de milieux », que définit « un ensemble de traits physiques : climat, sols, végétation ». Cette diversité vient surtout de l'étirement du pays en latitude.</p>\n<p>Le texte énumère ensuite les milieux : « le milieu béninien s'étend de la côte jusqu'à la latitude de Savè » ; le milieu sud-soudanien va jusqu'à la latitude de Bembèrèkè, « avec des sols ferrugineux et des savanes arborées » ; plus au nord, le milieu nord-soudanien s'étend jusqu'au Niger ; enfin, le milieu atacorien couvre le nord-ouest, « avec des sols souvent caillouteux ». Chaque milieu a donc son climat, ses sols et sa végétation.</p>\n<div class=\"lab\">Conclusion (opinion)</div>\n<p>À notre avis, cette diversité est une chance pour le développement du Bénin : les milieux se complètent, le sud fournissant les cultures de rente et l'ouverture maritime, le centre l'élevage et les carrières, le nord le coton et le tourisme de faune. Pour en profiter, il faut toutefois relier ces régions par de bonnes voies de communication.</p>\n</div></details>\n\n<h2 id=\"s8\"><span class=\"badge g\">Sujet 8</span>Explication de texte · Le milieu atacorien</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Pour préparer une sortie à la Pendjari, ta classe étudie un texte consacré au milieu atacorien.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des atouts du milieu atacorien.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">Le milieu atacorien occupe le nord-ouest du Bénin. Il est marqué par une chaîne de montagnes dont le point culminant est le mont Sagbarao, à 658 mètres. L'abondance des pluies orographiques et la végétation étagée favorisent des cultures variées et l'élevage de caprins et de porcins. Le parc national de la Pendjari et les chutes de Tanougou et de Kota attirent les touristes.</div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA2.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique les atouts du milieu atacorien.</li><li>Donne ton point de vue sur le rôle du tourisme dans la mise en valeur de ce milieu.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 2. Il met en relief les atouts du milieu atacorien.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>Pour l'auteur, ce milieu est d'abord un espace de montagnes : il est « marqué par une chaîne de montagnes dont le point culminant est le mont Sagbarao, à 658 mètres ». Les atouts viennent du relief : « l'abondance des pluies orographiques et la végétation étagée favorisent des cultures variées et l'élevage de caprins et de porcins ».</p>\n<p>Le tourisme est un second atout, car « le parc national de la Pendjari et les chutes de Tanougou et de Kota attirent les touristes ». Ainsi, le milieu atacorien offre de grandes possibilités à l'agriculture, à l'élevage et au tourisme.</p>\n<div class=\"lab\">Conclusion (opinion)</div>\n<p>À notre avis, le tourisme peut beaucoup contribuer à la mise en valeur du milieu atacorien : il crée des emplois, fait vivre l'artisanat et finance la protection de la faune et des sites. Il faut cependant l'organiser avec les communautés locales et préserver le parc de la Pendjari pour qu'il reste un atout durable.</p>\n</div></details>\n\n<h2 id=\"s9\"><span class=\"badge g\">Sujet 9</span>Explication de texte · L'utilité des eaux du Bénin</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre de la journée mondiale de l'eau, ton club d'environnement étudie un texte consacré aux cours d'eau et aux plans d'eau du Bénin.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente de l'utilité des cours d'eau et des plans d'eau du Bénin.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">Le réseau hydrographique du Bénin comprend deux bassins : le bassin du Niger et le bassin côtier. L'Ouémé, long de 510 kilomètres, est le plus grand fleuve du pays et se jette dans le lac Nokoué. Les cours d'eau et les plans d'eau sont très utiles : ils fournissent du poisson, servent de voies de communication, permettent le maraîchage et l'irrigation, et offrent des possibilités de production d'électricité grâce aux barrages. Le village lacustre de Ganvié attire aussi des touristes.</div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA2.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique l'utilité des cours d'eau et des plans d'eau du Bénin.</li><li>Donne ton point de vue sur la nécessité de protéger ces eaux.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 2. Il insiste sur l'utilité des cours d'eau et des plans d'eau du Bénin.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>L'auteur situe d'abord le réseau : il « comprend deux bassins : le bassin du Niger et le bassin côtier ». Il cite le principal fleuve : « l'Ouémé, long de 510 kilomètres, est le plus grand fleuve du pays et se jette dans le lac Nokoué ». Puis il énumère les services rendus : les cours d'eau et les plans d'eau « fournissent du poisson », ce qui nourrit les pêcheurs, et « servent de voies de communication », notamment sur le Nokoué et l'Ahémé.</p>\n<p>L'auteur précise qu'ils « permettent le maraîchage et l'irrigation », donc la production alimentaire, et « offrent des possibilités de production d'électricité grâce aux barrages », ce qui peut soutenir l'industrie. Il termine par le tourisme, avec le village lacustre de Ganvié. L'eau est donc une ressource à usages multiples pour le développement.</p>\n<div class=\"lab\">Conclusion (opinion)</div>\n<p>À notre avis, il est indispensable de protéger ces eaux : de nombreuses activités et des milliers de familles en dépendent. Les pollutions par les déchets, la surexploitation et l'encombrement les menacent ; la lutte contre ces atteintes, la sensibilisation des populations et l'application des lois doivent donc être des priorités.</p>\n</div></details>\n\n<h2 id=\"s10\"><span class=\"badge g\">Sujet 10</span>Explication de texte · Les menaces sur les milieux naturels</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'une campagne de reboisement, ton collège étudie un texte consacré aux menaces qui pèsent sur les milieux naturels du Bénin.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des menaces qui pèsent sur les milieux naturels du Bénin.</p>\n<p><span class=\"lbl\">Texte</span></p>\n<div class=\"texte\">Pour satisfaire ses besoins, l'homme mène des activités qui menacent les milieux naturels du Bénin. Le prélèvement abusif du sable marin fragilise la côte. Les feux de végétation et la déforestation détruisent le couvert végétal. Le braconnage appauvrit la faune. Le rejet anarchique des déchets pollue les cours d'eau et l'air. À ces menaces s'ajoute la surexploitation des plans d'eau.</div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA2.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.</li><li>Explique comment les activités humaines menacent les milieux naturels.</li><li>Donne ton point de vue sur les mesures à prendre pour les protéger.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)</div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 2. Il met en exergue les menaces que les activités humaines font peser sur les milieux naturels du Bénin.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>L'auteur pose d'abord le principe : « pour satisfaire ses besoins, l'homme mène des activités qui menacent les milieux naturels du Bénin ». Il détaille ensuite les atteintes. Sur le littoral, « le prélèvement abusif du sable marin fragilise la côte » et favorise l'érosion. Sur la végétation, « les feux de végétation et la déforestation détruisent le couvert végétal », ce qui appauvrit les sols et le climat local.</p>\n<p>Pour la faune, « le braconnage appauvrit la faune ». Pour l'eau et l'air, « le rejet anarchique des déchets pollue les cours d'eau et l'air », et la surexploitation des plans d'eau réduit les ressources en poissons. Ces atteintes ont des causes humaines et se cumulent, ce qui rend les milieux de plus en plus fragiles.</p>\n<div class=\"lab\">Conclusion (opinion)</div>\n<p>À notre avis, il faut agir sans attendre : appliquer les lois de protection, reboiser, interdire le prélèvement abusif du sable et les feux de brousse, gérer rationnellement les eaux et sensibiliser les communautés. Protéger les milieux naturels, c'est préserver les ressources dont dépend le développement du Bénin.</p>\n</div></details>","sa3":"<p class=\"sub\">Histoire · 5 dissertations et 5 explications de texte · format béninois : contexte d'évaluation, tâche, consigne</p>\n<div class=\"box\"><b>Rappel.</b> Chaque consigne ne porte que sur un seul volet : une consigne, un paragraphe ; une dissertation compte au plus trois consignes. <i>Dissertation :</i> introduction en un seul bloc (préambule, problématique affirmative, annonce du plan en questions ou sous forme affirmative) ; un paragraphe par consigne, reliés par des phrases de transition en gras ; conclusion (bilan et ouverture) ; ni tirets, ni astérisques dans la rédaction. <i>Explication de texte :</i> introduction = source + idée générale introduite par « il met en exergue / en relief… », « il aborde… » ou « il insiste sur… » ; corps = réponse à la consigne 2 appuyée sur au moins trois extraits entre guillemets ; conclusion = en Histoire, l'intérêt du texte. Les textes sont des textes d'entraînement : à l'examen, la source figure sous le texte, ne l'invente jamais.</div>\n<div class=\"box rule\"><b>Attention aux repères.</b> Mot « génocide » : 1944. DUDH : 10 décembre 1948. Procès de Nuremberg : 1945-1946. Amnesty International : 1961, Londres. Conférence d'Helsinki : 1975. Khmers rouges : 1975-1979. Charte africaine : Nairobi, 1981. Constitution du Bénin : 11 décembre 1990. Génocide rwandais : à partir du 6 avril 1994 ; TPIR : novembre 1994. Le président Habyarimana, dont l'avion est abattu le 6 avril 1994, était hutu et non tutsi (erreur présente dans la fiche de cours d'origine, corrigée ici).</div>\n\n<h2 id=\"s1\"><span class=\"badge\">Sujet 1</span>Dissertation · La notion de droits de l'homme</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>À l'occasion de la journée des droits de l'homme, le club d'éducation civique de ton collège te demande de présenter cette notion à tes camarades.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente de la notion de droits de l'homme.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Présente les droits humains.</li><li>Présente les types de droits humains.</li><li>Précise les devoirs de la personne humaine.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>Chaque être humain, où qu'il vive, aspire à vivre libre et dans la dignité. Les droits de l'homme, dont on peut préciser la définition, les caractéristiques, les types et les devoirs qu'ils impliquent, sont la base de cette dignité et de la paix entre les peuples. Notre devoir consistera à présenter les droits humains, à exposer leurs types, puis à préciser les devoirs de la personne.</p>\n<div class=\"lab\">Corps du devoir</div>\n<p>On appelle droits humains l'ensemble des droits propres à chaque être humain, sans aucune distinction, et sans lesquels les hommes ne peuvent pas vivre dans la dignité. Ils sont les fondements de la justice, de la paix et de la liberté. Ils sont universels, car ils sont valables pour tout le monde et partout dans le monde. Ils sont inaliénables, car personne n'a le droit d'empêcher son prochain d'en jouir, sous aucun prétexte. Ils sont indivisibles, car ils forment un tout inséparable, indispensable pour vivre dans la dignité. Enfin, ils sont inhérents, car les hommes naissent avec ces droits. <b>Ces droits se répartissent en grandes catégories.</b></p>\n<p>On distingue les droits civiques et politiques, comme le droit à la vie, à la liberté, à la sécurité individuelle et la liberté d'opinion, d'expression, de conscience et de religion, énoncés aux articles 3 à 21 de la Déclaration universelle des droits de l'homme ; et les droits économiques et sociaux, comme le droit au travail, à l'éducation et aux soins de santé, énoncés aux articles 22 à 27. <b>Avoir des droits, c'est aussi avoir des devoirs.</b></p>\n<p>Les droits de l'un sont les devoirs de l'autre. Chaque individu doit respecter ses parents, défendre l'unité nationale et payer ses impôts ; l'État doit assurer l'éducation, garantir le respect des droits et l'accès équitable aux soins et au travail.</p>\n<div class=\"lab\">Conclusion</div>\n<p>Universels, inaliénables, indivisibles et inhérents, les droits humains se répartissent en droits civiques et politiques et en droits économiques et sociaux, et s'accompagnent de devoirs pour les individus comme pour l'État. Comment ces droits sont-ils respectés au Bénin et dans le monde ?</p>\n</div></details>\n\n<h2 id=\"s2\"><span class=\"badge\">Sujet 2</span>Dissertation · Les violations des droits de l'homme</h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation</span><br>Dans le cadre d'une campagne de sensibilisation organisée dans ta commune, on te demande de présenter les violations des droits de l'homme.</p>\n<p><span class=\"lbl\">Tâche</span><br>À partir de tes savoirs construits, présente une analyse cohérente des violations des droits de l'homme au Bénin et dans le monde.</p>\n<p><span class=\"lbl\">Consigne</span></p>\n<ul><li>Décris quelques cas de violation des droits de l'homme dans ta commune.</li><li>Présente d'autres cas de violation des droits de l'homme dans le monde.</li><li>Explique pourquoi ces violations persistent.</li></ul>\n</div>\n<details><summary>Voir le corrigé rédigé</summary><div class=\"copie\">\n<div class=\"lab\">Introduction</div>\n<p>Malgré les textes qui les proclament, les droits de l'homme sont violés partout, jusque dans nos communes. Visibles dans la vie quotidienne comme à l'échelle du monde, ces violations persistent surtout à cause de l'ignorance et de la non-application des textes. Notre devoir consistera à
