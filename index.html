<style>
:root{
  --bg:#f5f7f5; --card:#ffffff; --ink:#15231c; --mute:#5b6b62; --line:#d9e1dc;
  --green:#0d4a33; --green2:#16714e; --gold:#e3a812; --red:#b3262d; --ok:#17794f; --okbg:#e3f4ea; --badbg:#fbe6e6;
  --soft:#eaf1ed;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1713;--card:#17231d;--ink:#e8f0ec;--mute:#9db0a6;--line:#2a3b33;--soft:#1d2d25;--okbg:#14352a;--badbg:#3a1b1d;--green:#0b3a28;}
}
:root[data-theme="dark"]{--bg:#0f1713;--card:#17231d;--ink:#e8f0ec;--mute:#9db0a6;--line:#2a3b33;--soft:#1d2d25;--okbg:#14352a;--badbg:#3a1b1d;--green:#0b3a28;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.55;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
h1,h2,h3,button,.ui{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.flag{height:5px;background:linear-gradient(90deg,#008751 0 34%,#fcd116 34% 67%,#e8112d 67%)}
header.top{background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header.top .t{flex:1;min-width:0}
header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
header.top p{margin:0;font-size:12px;opacity:.8}
header.top button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:12px}
main{padding:14px 14px 96px;max-width:760px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:11px 2px;font-size:12px;font-weight:600;border-top:3px solid transparent}
nav.tabs button.on{color:var(--green2);border-top-color:var(--gold)}
@media (prefers-color-scheme:dark){nav.tabs button.on{color:#6fd1a4}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:16px}
.row{display:flex;gap:10px;align-items:flex-start}
.badge{display:inline-block;font-family:system-ui,sans-serif;font-size:12px;font-weight:700;background:var(--soft);color:var(--green2);border-radius:6px;padding:2px 8px}
.sa-btn{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 10px;color:var(--ink);display:block}
.sa-btn b{display:block;font-size:16px;font-family:system-ui,sans-serif;margin-bottom:3px}
.sa-btn span{font-size:14px;color:var(--mute)}
.num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;align-items:center;justify-content:center;font-weight:700;font-family:system-ui,sans-serif;font-size:14px;flex:none}
.back{background:none;border:0;color:var(--green2);font-weight:700;padding:6px 0;font-size:14px;margin-bottom:6px}
h2.sa-title{font-size:19px;line-height:1.3;margin:4px 0 10px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;overflow:hidden}
summary{padding:13px 14px;font-weight:700;font-family:system-ui,sans-serif;font-size:15px;cursor:pointer}
details .in{padding:0 14px 12px}
details h4{margin:12px 0 4px;font-family:system-ui,sans-serif;font-size:14px;color:var(--green2)}
@media (prefers-color-scheme:dark){details h4{color:#6fd1a4}}
ul.pts{margin:4px 0 0;padding-left:20px}
ul.pts li{margin:0 0 7px;font-size:15.5px}
.box{border-left:4px solid var(--gold);background:var(--soft);padding:10px 12px;border-radius:0 8px 8px 0;margin:10px 0;font-size:15px}
.btn{font-family:system-ui,sans-serif;background:var(--green2);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;width:100%}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px}
.opt{display:block;width:100%;text-align:left;font-family:system-ui,sans-serif;font-size:15px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin:0 0 8px}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--red);background:var(--badbg)}
.prog{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--gold)}
.fc{min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;padding:18px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px}
.fc.ans{background:var(--okbg);border-color:var(--ok)}
.ep-q{margin:0 0 12px;font-size:15.5px}
.ep-r{background:var(--okbg);border-left:4px solid var(--ok);padding:10px 12px;border-radius:0 8px 8px 0;margin:6px 0 14px;font-size:15px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
table.t td:first-child{font-family:system-ui,sans-serif;font-weight:700;width:34%;color:var(--green2)}
.seg{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.seg button{font-family:system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600}
.seg button.on{background:var(--green2);color:#fff;border-color:var(--green2)}
input.code{width:100%;font-size:20px;letter-spacing:2px;text-align:center;padding:13px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-transform:uppercase;font-family:ui-monospace,monospace}
.msg{font-family:system-ui,sans-serif;font-size:14px;margin:8px 0;color:var(--red);min-height:20px}
.gate{max-width:480px;margin:0 auto;padding:22px 16px}
.gate h2{font-size:24px;line-height:1.2;margin:14px 0 4px}
.price{font-family:system-ui,sans-serif;font-size:15px;background:var(--soft);border-radius:10px;padding:12px;margin:14px 0}
.hide{display:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.small{font-size:13px;color:var(--mute);font-family:system-ui,sans-serif}

<script>
const SA = [{"id":1,"court":"Traite transatlantique","titre":"Comment expliquer la participation des anciens royaumes côtiers de l'actuelle République du Bénin à la traite transatlantique du XVIe au XIXe siècle ?","duree":"18 h","dom":"Histoire","intro":"Du XVIe au XIXe siècle, l'Afrique a été victime d'un trafic d'êtres humains appelé traite négrière. La découverte de l'Amérique et sa mise en valeur sont à l'origine de ce commerce qui a mis en relation trois continents : l'Europe, l'Afrique et l'Amérique. Plusieurs entités politiques côtières du Bénin y ont pris part, avec des conséquences différentes d'un royaume à l'autre. Pourquoi et comment ces royaumes ont-ils participé à la traite, et que pense-t-on aujourd'hui de cette histoire ?","parts":[{"t":"I. Les généralités sur la traite transatlantique","blocks":[{"h":"1.1 Définition et contexte historique","pts":["Traite transatlantique (ou traite des Noirs, ou commerce triangulaire) : déportation massive d'Africains noirs vers le continent américain, où ils étaient utilisés comme esclaves dans les plantations et les mines. C'est un trafic humain pratiqué par les Européens du XVIe au XIXe siècle, soit environ trois cents ans. On l'appelle commerce triangulaire parce qu'elle implique trois continents.","La découverte de l'Amérique : le 12 octobre 1492, Christophe Colomb atteint un continent qu'il prend pour les Indes. Cette terre est riche en mines, en sols fertiles et en climats favorables à l'agriculture intensive (coton, café, cacao, canne à sucre, tabac). Elle exige une main-d'œuvre abondante : c'est la raison principale du déclenchement de la traite.","Les nouveaux besoins de l'Europe : produits tropicaux (café, cacao, gingembre, poivre, indigo, soie, canne à sucre, tabac, piment) et métaux précieux (or, argent, cuivre, ivoire) nécessaires aux industries. Le climat tempéré de l'Europe ne permet pas ces cultures et ses ressources minières diminuent : c'est la deuxième raison de la traite.","Les besoins de main-d'œuvre en Amérique : jusqu'au milieu du XVIe siècle, les Européens emploient massivement les Amérindiens dans les mines et les plantations ; les conditions de travail très dures et les épidémies les déciment. Les Européens se tournent alors vers l'Afrique."]},{"h":"1.2 Les conditions favorables à la traite","pts":["En Afrique : l'esclavage existait avant l'arrivée des Européens (prisonniers de guerre, criminels, débiteurs insolvables employés aux travaux domestiques et champêtres) ; la traite transsaharienne et la traite orientale, menées par les Arabes, l'avaient précédée ; les Noirs, robustes et résistants aux travaux des champs, supportaient un climat semblable à celui de l'Amérique.","Dans le royaume de Danxomè, conditions internes : esclavage antérieur à la traite et société pyramidale (le roi Dada au sommet, les princes Axovi, les hommes libres Anato, les esclaves Kannoumon à la base). Conditions externes : présence des Européens sur la côte sous le roi Agadja (1708-1740), attrait des rois pour les produits européens, pratique de la traite par les royaumes voisins de Savi, Ouidah et Allada.","Dans le royaume de Xogbonou (Porto-Novo), conditions internes : esclavage préexistant et société hiérarchisée (le roi Ahossou, les princes Ahovi, les hommes libres Ayinonvi, les serviteurs Lari, les esclaves Kannoumon). Conditions externes : forte présence des Européens sur la côte du golfe du Bénin dès le XVe siècle et traite pratiquée à Ouidah, à Savi et à Badagry."]},{"h":"1.3 L'organisation de la traite : le commerce triangulaire","pts":["Les préparatifs en Europe : dans de grands ports (Nantes, Londres, Lisbonne, Liverpool, Amsterdam), des compagnies maritimes chargent des navires de pacotilles (armes à feu, miroirs, quincaillerie, tissus, alcool, poudre à canon) et les envoient vers l'Afrique occidentale.","Les échanges en Afrique : les Européens installent des comptoirs le long des côtes. Les pacotilles sont échangées contre des esclaves capturés lors des razzias et des guerres de conquête. Des médecins examinent les captifs et recherchent des jeunes de 18 à 25 ans, robustes et sans défaut physique. Les échanges se font par l'intermédiaire de courtiers, sur des places publiques comme la place Chacha à Ouidah.","L'acheminement et la vente en Amérique : les esclaves sont marqués au fer brûlant, enchaînés et entassés dans les cales. La traversée dure des mois, dans des conditions épouvantables (mauvaise nourriture, violences, épidémies) ; à peine les deux tiers des esclaves embarqués arrivent vivants. En Amérique, les survivants sont réexaminés, lavés, vendus aux enchères comme du bétail, puis employés dans les mines, les plantations ou comme domestiques.","Le retour des négriers : les navires reviennent chargés de produits tropicaux (café, cacao, tabac, canne à sucre), de métaux précieux et d'épices, vendus très cher en Europe. Vidés, ils sont de nouveau remplis de pacotilles pour l'Afrique. Schéma du triangle : Europe → Afrique (pacotilles) → Amérique (esclaves) → Europe (produits tropicaux)."]}]},{"t":"II. La participation des anciens royaumes côtiers du Bénin","blocks":[{"h":"2.1 Les petites entités côtières","pts":["Agoué, petite localité à 18 km de Grand-Popo, bénéficie d'une situation favorable. Son arrière-pays fournit des esclaves (Ewé, Watchi, Anlo) et Francisco Félix de Souza y crée une captiverie.","Jaquin est la porte océane du royaume d'Allada ; il contrôle longtemps le trafic avant d'être annexé par Abomey en 1732.","Gléxwé (Ouidah) est l'un des principaux points d'embarquement vers l'Amérique. Après l'implantation des forts en 1671, Ouidah devient l'interface commerciale entre les négriers européens et le royaume d'Abomey. La traite y est érigée en monopole royal par le roi Kpingla (1774-1789). Les esclaves sont rassemblés place Chacha pour être vendus.","Kutonu (Cotonou) participe à la traite à partir de 1830. Pour échapper à la surveillance des Anglais, devenus antiesclavagistes, qui guettent le port négrier de Ouidah, le roi Ghézo, aidé de son ministre Yèkpè Zinsou, en fait le second port du Danxomè. Village d'esclaves d'environ 400 hectares, il ne sert que trois ans, car la traite est définitivement abolie en 1833 : c'est le dernier village d'esclaves du Danxomè."]},{"h":"2.2 Le royaume d'Allada","pts":["Allada est une puissance régionale de 1600 à 1670 grâce à la traite, dont les esclaves sont acheminés par Jaquin.","À partir de 1670, pour mieux contrôler ce commerce, Allada engage des réformes. Les Européens s'en inquiètent et ouvrent des comptoirs ailleurs ; les activités d'Allada diminuent progressivement jusqu'à sa disparition au profit de Ouidah."]},{"h":"2.3 Le royaume de Xogbonou (Porto-Novo)","pts":["Situé au sud-est du Bénin, dans l'actuel département de l'Ouémé, le royaume entre tard dans la traite, pour une courte durée. Elle commence quand le Portugais Domingo propose des cadeaux contre des esclaves, sous le roi Dèmeyi (Dê Mêssê, 1752-1757).","Les esclaves, obtenus par la ruse, par les razzias ou par héritage, sont vendus au marché Ogagbami (Oja Eru), près du palais royal de Honmè, par troc ou parfois contre de la monnaie. Ils sont embarqués sur la lagune (Odo Oba) et sur l'océan à Ekpè et à Okoun-Sèmè.","Évolution : traite intensifiée sous Dê Houffon (1794-1807), clandestine sous Dê Sodji (1848-1861), en déclin dès l'avènement de Dê Mikpon (1861-1872). Particularité : le commerce n'est ni centralisé ni contrôlé par la cour ; chacun peut vendre ou acheter librement, sans payer de droits au roi.","Conséquences. Politiques : dépendance vis-à-vis d'Oyo jusqu'en 1820 pour se protéger du Danxomè ; traité de protectorat avec les Français sous Dê Sodji. Sociales : esclaves yoruba du Nigeria, rupture des amitiés entre royaumes voisins, apparition des Afro-brésiliens (Paraïso, Domingo, De Souza, Do Régo, Da Silva) placés dans l'administration. Économiques : enrichissement des hauts dignitaires, maisons de commerce européennes, plantes nouvelles (tomate, haricot, maïs, palmier à huile). Culturelles : islam et christianisme, nouvelles habitudes culinaires, ludiques et architecturales, influence du portugais sur le goun."]},{"h":"2.4 Le royaume d'Abomey (Danxomè)","pts":["Le Danxomè, situé sur le plateau d'Abomey (actuel département du Zou), fait de la traite une activité de la famille royale. La guerre sert à capturer des esclaves chez les Mahi (Savalou), les Yoruba et les Nago (Savè, Dassa, Kétou).","Sans accès direct à la mer, il passe par Allada, Savi et Ouidah et leur paie une taxe, le dénou. Pour y échapper, il annexe Allada en 1724, Savi en 1727, Djèkin en 1732 et Ouidah en 1741 sous les rois Agadja et Tégbessou. Ouidah devient le principal centre commercial ; le roi y nomme un Yovogan, représentant chargé des relations avec les Blancs, qui regroupe les esclaves place Chacha et prélève des taxes.","La route de l'esclave relie Abomey à Ouidah par Kana, Zogbodomey, Toffo, Allada et Savi. À Ouidah, ses étapes sont : 1° place Chacha (vente) ; 2° arbre de l'oubli (9 tours pour les hommes, 7 pour les femmes, pour oublier leur passé et leur identité) ; 3° place Zomaï (case fermée où l'on enferme les captifs) ; 4° mémorial de Zoungbodji (fosse où l'on jette les malades et les mourants) ; 5° arbre du retour (3 tours, pour que leur souffle revienne après leur mort) ; 6° porte du non-retour, avant l'embarquement à la plage de Djègbadji.","Évolution : la traite se déroule sans difficulté jusqu'à la fin du XVIIIe siècle, surtout sous Ghézo (1818-1858), aidé de Francisco Félix de Souza. Le Congrès de Vienne (1815) décide l'abolition (protestations, bouleversements révolutionnaires, essor d'une industrie qui exige moins de main-d'œuvre). La traite devient clandestine de 1815 à 1865 environ, avec Kutonu comme port depuis 1830. Ghézo encourage alors le palmier à huile, le manioc et le maïs ; cette reconversion permet au Danxomè de survivre à la fin de la traite, contrairement à Ouidah, Allada et Savi.","Conséquences économiques : ruine de l'économie traditionnelle (agriculture, pêche, artisanat) concurrencée par les produits de traite ; enrichissement par les taxes ; nouvelles cultures (coton, tabac, manioc, palmier à huile) ; nouveaux métiers après l'abolition. Politiques : armée renforcée en armes, création du corps des amazones, disparition d'Allada, Savi, Djèkin et Ouidah, guerres contre Kétou et Dassa-Zoumè. Sociales : dépeuplement des royaumes voisins, zones de refuge (villages lacustres de Ganvié, Aguégué, So-Ava ; collines de Dassa, Savè, Savalou), haine envers le Danxomè, installation des Afro-brésiliens à Ouidah. Culturelles : nouvelles traditions ludiques et architecturales, plats nouveaux, danses nouvelles (jazz, carnaval, salsa)."]},{"h":"2.5 L'abolition de la traite","pts":["La chronologie de l'abolition s'étale sur plus de cinquante ans. Le 4 février 1794, la Convention nationale française abolit l'esclavage dans toutes les colonies, mais le négoce français obtient de revenir sur cette décision. L'interdiction de la traite ne pouvait être respectée tant que l'esclavage persistait.","L'Angleterre montre la voie en 1833. En France, Victor Schœlcher, sous-secrétaire d'État aux colonies de la IIe République, obtient le 27 avril 1848 le décret d'abolition de l'esclavage dans les colonies françaises. Pour trouver une main-d'œuvre abondante et bon marché, l'Europe se tourne ensuite vers d'autres sources et vers la révolution industrielle."]},{"h":"2.6 Les conséquences générales de la traite","pts":["Pour l'Afrique : perte d'hommes difficile à chiffrer, car il faut compter les captifs embarqués et les victimes des razzias ; déséquilibre démographique ; désorganisation de l'économie (les négriers choisissent les plus valides, de nombreux Africains abandonnent leurs activités pour la traite, les produits européens font décliner l'artisanat) ; bouleversements sociaux (nouvelles classes de marchands, rois qui perdent leur pouvoir ou leur crédibilité) ; maladies nouvelles ; violence permanente et diffusion des armes à feu, source de guerres répétées.","Pour l'Europe : enrichissement des commerçants et des ports (Nantes, Bordeaux, Amsterdam), essor des industries textiles, capitaux réinvestis lors de la révolution industrielle du XIXe siècle ; naissance de mouvements abolitionnistes, soutenus par les récits d'anciens esclaves comme Olaudah Equiano.","Pour l'Amérique : démographiquement, des millions de Noirs y restent et forment des communautés en partie métissées ; économiquement, leur travail permet l'expansion du continent ; politiquement, ils participent aux indépendances, se soulèvent à Saint-Domingue sous Toussaint Louverture, et la guerre de Sécession (1860-1865) oppose le Nord abolitionniste au Sud des planteurs ; culturellement, ils apportent le vodou, le jazz, la samba."]}]},{"t":"III. Les débats actuels sur la traite transatlantique","blocks":[{"h":"3.1 La préoccupation revendicative","pts":["Lors de rencontres internationales, des Africains affirment que l'Europe doit les dédommager pour les méfaits de la traite. Les pays anglophones (Zambie, Namibie, Zimbabwe, Tanzanie…) défendent cette position avec plus de force que les pays francophones, plus souples. Le propos souvent cité résume l'idée : « Vous nous avez volé nos gens, vous vous êtes enrichis, nous nous sommes appauvris, vous devez nous payer » (Iroko, 2003).","En septembre 2001, la conférence mondiale des Nations unies contre le racisme à Durban (Afrique du Sud) voit de nombreux pays demander que la question des réparations soit inscrite à l'ordre du jour."]},{"h":"3.2 L'option conciliatrice","pts":["Des voix, surtout celles des pays francophones, préfèrent le pardon, la repentance et la réconciliation. L'Europe reconnaîtrait sa responsabilité et présenterait des excuses ; les Africains présenteraient les leurs aux Noirs d'Amérique pour avoir vendu leurs ancêtres.","Cette option se concrétise à Cotonou, en décembre 1999, lors d'une conférence sur le thème « Réconciliation et développement », qui réunit des délégations d'Afrique, d'Europe et d'Amérique. Christiane Taubira, députée de la Guyane, fait ensuite adopter par l'Assemblée nationale française la loi du 21 mai 2001 qui reconnaît la traite et l'esclavage comme crime contre l'humanité."]}]}],"concl":"La traite transatlantique est un événement majeur qui a mis en contact l'Europe, l'Afrique et l'Amérique. Les royaumes du sud du Bénin y ont participé activement, avec des conséquences multiples et durables : enrichissement de quelques-uns, ruine des économies traditionnelles, dépeuplement et divisions. Aujourd'hui, le débat entre revendication et réconciliation reste ouvert.","fc":[["Qu'est-ce que la traite transatlantique ?","La déportation massive d'Africains noirs vers l'Amérique, où ils étaient employés comme esclaves, du XVIe au XIXe siècle (environ 300 ans)."],["Pourquoi l'appelle-t-on commerce triangulaire ?","Parce qu'elle relie trois continents : l'Europe, l'Afrique et l'Amérique."],["Quand et par qui l'Amérique est-elle découverte ?","Le 12 octobre 1492, par Christophe Colomb, qui croyait avoir atteint les Indes."],["Quelles sont les trois grandes raisons de la traite ?","La mise en valeur de l'Amérique, les nouveaux besoins de l'Europe en produits tropicaux et métaux précieux, la disparition des Amérindiens employés comme main-d'œuvre."],["Que sont les pacotilles ?","Les marchandises européennes échangées contre des esclaves : armes à feu, alcool, miroirs, tissus, poudre à canon, quincaillerie."],["Quelles sont les étapes de la traite ?","Préparatifs en Europe, échanges en Afrique, acheminement et vente en Amérique, retour des négriers."],["Qui est le Yovogan ?","Le représentant du roi du Danxomè à Ouidah, chargé des relations avec les Blancs et du prélèvement des taxes."],["Cite les étapes de la route de l'esclave à Ouidah.","Place Chacha, arbre de l'oubli, place Zomaï, mémorial de Zoungbodji, arbre du retour, porte du non-retour."],["Comment le Danxomè a-t-il survécu à la fin de la traite ?","Avec Ghézo, il a reconverti son économie vers l'huile de palme et les cultures vivrières (manioc, maïs)."],["Quels sont les deux camps du débat actuel sur la traite ?","La préoccupation revendicative (réparations) et l'option conciliatrice (pardon et réconciliation)."]],"quiz":[{"q":"La traite transatlantique a duré environ :","o":["100 ans","300 ans","500 ans","50 ans"],"a":1,"e":"Du XVIe au XIXe siècle, soit environ trois cents ans."},{"q":"Le commerce triangulaire relie :","o":["Europe, Asie, Amérique","Europe, Afrique, Amérique","Afrique, Asie, Océanie","Europe, Afrique, Asie"],"a":1,"e":"Trois continents : l'Europe, l'Afrique et l'Amérique."},{"q":"L'Amérique est découverte le 12 octobre :","o":["1392","1492","1592","1692"],"a":1,"e":"Christophe Colomb y aborde le 12 octobre 1492."},{"q":"Pourquoi les Européens se tournent-ils vers l'Afrique pour la main-d'œuvre ?","o":["Les Amérindiens étaient décimés par le travail dur et les épidémies","L'Afrique manquait d'habitants","Les Africains demandaient à partir","L'Asie était trop loin"],"a":0,"e":"Les Amérindiens, épuisés par le travail et les maladies, ne suffisaient plus."},{"q":"On appelle pacotilles :","o":["Les esclaves vendus","Les marchandises européennes échangées contre des esclaves","Les navires négriers","Les taxes du roi"],"a":1,"e":"Armes, alcool, miroirs, tissus : les produits de traite."},{"q":"Quel âge les médecins recherchent-ils chez les esclaves ?","o":["5 à 10 ans","18 à 25 ans","40 à 50 ans","Aucune limite"],"a":1,"e":"Des jeunes de 18 à 25 ans, robustes et sans défaut physique."},{"q":"Quel royaume est une puissance régionale de 1600 à 1670 grâce à la traite ?","o":["Abomey","Allada","Porto-Novo","Nikki"],"a":1,"e":"Allada, dont le port est Jaquin."},{"q":"Le Danxomè annexe Ouidah en :","o":["1724","1727","1732","1741"],"a":3,"e":"Allada 1724, Savi 1727, Djèkin 1732, Ouidah 1741."},{"q":"Le Yovogan est :","o":["Un navire négrier","Le représentant du roi à Ouidah","Un roi de Porto-Novo","Un marché d'esclaves"],"a":1,"e":"Il est chargé des relations avec les Blancs et des taxes."},{"q":"Combien de fois les hommes tournent-ils autour de l'arbre de l'oubli ?","o":["3 fois","7 fois","9 fois","12 fois"],"a":2,"e":"9 fois pour les hommes, 7 fois pour les femmes."},{"q":"Quelle est la particularité de la traite à Porto-Novo ?","o":["Elle était un monopole royal","Elle n'était ni centralisée ni contrôlée par la cour","Elle durait depuis le XVe siècle","Elle était interdite"],"a":1,"e":"Chacun pouvait vendre ou acheter sans payer de droits au roi."},{"q":"Kutonu devient un port de traite sous le roi :","o":["Agadja","Kpingla","Ghézo","Béhanzin"],"a":2,"e":"En 1830, pour échapper à la surveillance anglaise à Ouidah."},{"q":"Qui obtient le décret d'abolition de l'esclavage du 27 avril 1848 ?","o":["Napoléon","Victor Schœlcher","Toussaint Louverture","Christiane Taubira"],"a":1,"e":"Victor Schœlcher, sous-secrétaire d'État aux colonies de la IIe République."},{"q":"Quelle culture Ghézo encourage-t-il pour remplacer la traite ?","o":["Le palmier à huile","Le thé","Le blé","Le riz irrigué"],"a":0,"e":"Le palmier à huile, avec le manioc et le maïs."},{"q":"Quelle option du débat actuel prône le pardon et la réconciliation ?","o":["La préoccupation revendicative","L'option conciliatrice","Le boycott","Le négationnisme"],"a":1,"e":"Elle s'est concrétisée à Cotonou en décembre 1999."}]},{"id":2,"court":"Milieux naturels du Bénin","titre":"Quels sont les atouts des milieux naturels pour le développement de la République du Bénin ?","duree":"18 h","dom":"Géographie","intro":"Le Bénin est situé en Afrique de l'Ouest, dans la zone intertropicale. Limité au nord par le Niger, au nord-ouest par le Burkina Faso, au sud par l'océan Atlantique, à l'est par le Nigeria et à l'ouest par le Togo, il s'étire en latitude et possède des milieux naturels variés : les milieux béninien, sud-soudanien, nord-soudanien et atacorien. Climat chaud et humide sous l'influence de la mousson, vent humide venu du sud-ouest, et de l'alizé du nord-est, vent sec de la grande saison sèche. Chaque milieu offre des atouts et des contraintes pour le développement. Quels sont-ils, et comment protéger ces milieux ?","parts":[{"t":"I. Le milieu béninien (subéquatorial)","blocks":[{"h":"1.1 Localisation et caractéristiques","pts":["Localisation : le milieu béninien, ou milieu subéquatorial, s'étend de la côte jusqu'à la latitude de Savè (autour du 8e parallèle nord).","Relief : plaine côtière, plateaux de terre de barre du bas-Bénin et plaine cristalline ; un relief peu contraignant pour les transports terrestres.","Climat : chaud et humide, avec des températures élevées mais jamais excessives (24 à 26 °C) et de 800 à 1 300 mm de pluies par an. Quatre saisons : grande saison des pluies d'avril à juillet, petite saison sèche d'août à septembre, petite saison des pluies d'octobre à novembre, grande saison sèche de décembre à mars.","Sols : hydromorphes fertiles, terre de barre, vallées alluviales irrigables de l'Ouémé et du Mono ; on rencontre aussi des sols ferralitiques, des vertisols et des sols ferrugineux peu concrétionnés.","Végétation et faune : la forêt claire a été quasiment détruite et remplacée par endroits par des plantations de palmiers, de cocotiers et de tecks, ainsi que par la mangrove. La faune comprend herbivores, rongeurs, singes, oiseaux, reptiles et insectes."]},{"h":"1.2 Les atouts","pts":["Agriculture : les deux saisons des pluies permettent deux récoltes et la diversité des cultures ; les sols fertiles et les vallées irrigables favorisent l'agriculture.","Élevage : la disponibilité du pâturage et de l'eau permet l'élevage du petit bovin (race lagunaire).","Pêche et transports par voie d'eau : les lacs, les lagunes et l'océan Atlantique permettent la pêche et le transport sur l'eau ; l'océan ouvre le Bénin au reste du monde par voie maritime (importations et exportations).","Tourisme : les belles plages de Cotonou, de Ouidah et de Grand-Popo.","Exploitation forestière et artisanat grâce aux bois d'œuvre et à la mangrove.","Sous-sol : le calcaire d'Onigbolo, l'eau minérale de Possotomè et de Hêtin-Sota, le sable de verrerie de Houéyogbé peuvent stimuler l'industrialisation."]},{"h":"1.3 Les contraintes","pts":["Prélèvement abusif du sable marin ; surexploitation et encombrement des cours et plans d'eau ; feux de végétation ; déforestation ; rejet anarchique de déchets gazeux et liquides.","Inondations fréquentes des fleuves, qui endeuillent les populations riveraines."]}]},{"t":"II. Le milieu sud-soudanien","blocks":[{"h":"2.1 Localisation et caractéristiques","pts":["Localisation : de la latitude de Savè à celle de Bembèrèkè.","Relief peu accidenté, dominé par la pénéplaine cristalline parsemée de collines, donc peu contraignant pour les transports terrestres ; sols ferrugineux.","Climat : abondance des pluies (800 à 1 300 mm par an) et diversité climatique favorables à des cultures variées.","Végétation : savane arborée (néré, karité, baobab, kapokier, cailcédrat), réserves et forêts galeries le long des cours d'eau. Faune : gros herbivores (buffles, éléphants, girafes, phacochères, antilopes), carnivores (lions, léopards), rongeurs, oiseaux, insectes."]},{"h":"2.2 Les atouts","pts":["Agriculture variée, élevage grâce au pâturage et à l'eau, sylviculture grâce à l'abondance des pluies et à la variété de la flore ; le bois et les matières premières végétales alimentent l'artisanat rural.","Tourisme : faune diversifiée et collines de Dassa, de Savè et de Savalou.","Pêche : l'Ouémé et son affluent l'Okpara.","Sous-sol : marbre d'Idadjo (Ouessè) ; granite de Dassa, utilisé pour les routes, les habitations et des ouvrages comme l'épi de Siafato contre l'avancée de l'océan."]},{"h":"2.3 Les contraintes","pts":["Surpâturage, surexploitation et encombrement des cours d'eau, feux de végétation, déforestation, braconnage, rejet anarchique de déchets.","Inondations périodiques, notamment de l'Okpara, qui ravagent les champs et les plantations et rendent difficiles les déplacements."]}]},{"t":"III. Le milieu nord-soudanien","blocks":[{"h":"3.1 Localisation et caractéristiques","pts":["Localisation : de la latitude de Bembèrèkè au fleuve Niger.","Relief peu accidenté, donc peu contraignant pour les transports ; plaines du Borgou favorables à la culture du coton.","Climat : une saison sèche (novembre à mai) et une saison des pluies (juin à octobre) bien marquées ; l'harmattan sévit fortement, avec des températures pouvant atteindre 34 °C et moins de 1 000 mm de pluies par an.","Végétation : dense seulement le long des cours d'eau (forêt galerie) ; ailleurs, savane arborée et arbustive avec épineux et rôniers ; plantations de tecks et d'anacardiers."]},{"h":"3.2 Les atouts","pts":["Tourisme : parc national du W du Niger et chutes de Koudou.","Agriculture et élevage bovin grâce à la diversité climatique, au pâturage et à l'eau.","Chasse : zones cynégétiques des parcs nationaux de la Pendjari et du W.","Pêche sur le fleuve Niger et ses affluents (Mékrou, Alibori, Sota) ; possibilité de barrages hydroélectriques (Mékrou) ; fleuve Niger navigable de juillet à février.","Sous-sol : fer de Loumbou-Loumbou et de Madikali."]},{"h":"3.3 Les contraintes","pts":["Surpâturage, surexploitation des cours d'eau, feux de végétation, déforestation, braconnage.","Avancée du désert : fortes chaleurs, saison pluvieuse réduite à trois mois, déboisement et disparition d'espèces végétales et animales.","Insectes vecteurs de maladies (mouche tsé-tsé, moucherons), qui gênent l'élevage près de certains cours d'eau."]}]},{"t":"IV. Le milieu atacorien","blocks":[{"h":"4.1 Localisation et caractéristiques","pts":["Localisation : au nord-ouest du Bénin, avec une chaîne de montagnes dont le point culminant est le mont Sagbarao (658 m).","Climat : pluies orographiques abondantes (1 300 mm par an) ; végétation étagée sur des sols diversifiés, souvent caillouteux et parfois cuirassés."]},{"h":"4.2 Les atouts","pts":["Tourisme : parc national de la Pendjari, chutes de Tanougou et de Kota.","Cultures variées et élevage de caprins et de porcins grâce aux pluies, à la végétation et aux sols.","Chasse dans les zones cynégétiques de la Pendjari ; pêche sur le fleuve Pendjari, qui conditionne aussi la vie de la faune du parc.","Énergie : possibilité de micro-barrages hydroélectriques (Yéripao). Sous-sol : or de Perma, pierres ornementales."]},{"h":"4.3 Les contraintes","pts":["Feux de végétation, déforestation, braconnage.","La chaîne de l'Atacora gêne la circulation des personnes.","Rareté du pâturage et de l'eau en saison sèche : les populations constituent des réserves de foin et des retenues d'eau, et la faune migre.","Inondations périodiques qui ravagent les champs et les plantations."]}]},{"t":"V. Le réseau hydrographique et son utilité","blocks":[{"h":"5.1 Le réseau hydrographique du Bénin","pts":["Réseau hydrographique : ensemble des cours d'eau et plans d'eau d'une région. Celui du Bénin se divise en deux grands bassins : le bassin du Niger et le bassin côtier. La ligne de partage passe par Kopargo à l'ouest, Bembèrèkè au centre et Nikki à l'est.","Le bassin du Niger : drainé de l'ouest à l'est par le Mékrou (410 km), l'Alibori (338 km) et la Sota (250 km), principaux affluents du Niger qui coulent du sud vers le nord. La Pendjari (380 km) prend sa source dans l'Atacora et se jette dans la Volta, au Ghana.","Le bassin côtier : l'Ouémé (510 km), plus grand fleuve du Bénin, reçoit l'Okpara (200 km) et le Zou (150 km) et se jette dans le lac Nokoué ; le Couffo (190 km), qui naît au Togo, se jette dans le lac Ahémé ; le Mono (500 km), qui naît dans les monts d'Alédjo, forme la frontière avec le Togo sur 100 km et se jette dans la lagune de Grand-Popo.","Les lacs et lagunes du sud, séparés de l'océan par un mince cordon littoral : lac Nokoué (150 km²), lac Ahémé (78 km²), lac Toho (15 km²), lagune de Porto-Novo (35 km²), lagune de Ouidah (40 km²), lagune de Grand-Popo (15 km²)."]},{"h":"5.2 L'utilité des cours d'eau et des plans d'eau","pts":["Pêche : la richesse en poissons rend l'activité fructueuse.","Voies de communication : de Togbin à Grand-Popo et vers le Nigeria, des Aguégués à Sogon, sur le Niger, le Nokoué et l'Ahémé.","Agriculture : maraîchage (vallées du bas-Ouémé, de la Sazué, du Mono, de l'Alibori et du Niger) et irrigation (ferme d'Ajara-Hounvè, périmètre sucrier de Savè, ferme d'Aokpara, périmètres rizicoles des vallées du Niger et de l'Ouémé) ; élevage de bovins, de caprins et d'ovins.","Énergie : barrage d'Adjarala en projet sur le Mono, barrage de Bétérou sur l'Ouémé.","Tourisme : chute de Koutamakou, village lacustre de Ganvié."]}]},{"t":"VI. Bilan et protection des milieux naturels","blocks":[{"h":"6.1 Ce qu'il faut retenir","pts":["L'étirement du Bénin en latitude explique la diversité des climats et des productions agricoles. La diversité des milieux est favorable aux activités économiques, et les milieux se complètent.","Les populations utilisent les ressources végétales et fauniques pour satisfaire leurs besoins alimentaires ; les richesses du sous-sol peuvent favoriser l'industrie ; la richesse faunique promet l'écotourisme."]},{"h":"6.2 Protéger les milieux naturels","pts":["Appliquer les dispositions en vigueur en matière de protection ; reboiser et entretenir les espèces végétales ; conserver et défendre les écosystèmes et la biodiversité ; vivre en harmonie avec l'environnement ; gérer rationnellement les milieux naturels ; mener des campagnes d'information et de sensibilisation sur les méfaits de la dégradation des milieux."]}]}],"concl":"Grâce à son étirement en latitude, le Bénin possède des milieux naturels variés et complémentaires, riches en atouts pour l'agriculture, l'élevage, la pêche, le tourisme, l'énergie et l'industrie. Mais ces milieux subissent des contraintes naturelles et surtout des menaces dues aux activités humaines : leur protection est une condition du développement durable.","fc":[["Jusqu'où s'étend le milieu béninien ?","De la côte jusqu'à la latitude de Savè."],["Quels sont les quatre milieux naturels du Bénin ?","Les milieux béninien (subéquatorial), sud-soudanien, nord-soudanien et atacorien."],["Donne les quatre saisons du milieu béninien.","Grande saison des pluies (avril-juillet), petite saison sèche (août-septembre), petite saison des pluies (octobre-novembre), grande saison sèche (décembre-mars)."],["Quel est le point culminant du Bénin et où se trouve-t-il ?","Le mont Sagbarao (658 m), dans la chaîne de l'Atacora."],["Quelles sont les limites du milieu sud-soudanien ?","De la latitude de Savè à celle de Bembèrèkè."],["Quelle est la contrainte majeure du milieu nord-soudanien ?","L'avancée du désert, avec la réduction de la saison des pluies à trois mois, et les insectes vecteurs de maladies."],["Cite les deux bassins hydrographiques du Bénin.","Le bassin du Niger et le bassin côtier."],["Quel est le plus grand fleuve du Bénin ?","L'Ouémé (510 km), qui se jette dans le lac Nokoué."],["Cite trois utilités des cours d'eau et plans d'eau.","Pêche, voies de communication, agriculture (maraîchage, irrigation), énergie hydroélectrique, tourisme."],["Cite trois mesures de protection des milieux naturels.","Reboisement, application des lois de protection, sensibilisation des communautés, gestion rationnelle des milieux."]],"quiz":[{"q":"Le milieu béninien s'étend de la côte jusqu'à la latitude de :","o":["Savè","Bembèrèkè","Natitingou","Malanville"],"a":0,"e":"Il est aussi appelé milieu subéquatorial."},{"q":"Quelles sont les températures moyennes du milieu béninien ?","o":["10 à 15 °C","24 à 26 °C","35 à 40 °C","0 à 5 °C"],"a":1,"e":"Des températures élevées mais jamais excessives."},{"q":"Combien de saisons des pluies le milieu béninien compte-t-il ?","o":["Une","Deux","Trois","Quatre"],"a":1,"e":"Une grande (avril-juillet) et une petite (octobre-novembre) : donc deux récoltes."},{"q":"Quel vent humide apporte la pluie au Bénin ?","o":["L'harmattan","L'alizé du nord-est","La mousson","Le sirocco"],"a":2,"e":"La mousson vient du sud-ouest ; l'alizé du nord-est souffle pendant la grande saison sèche."},{"q":"Quelle ressource du sous-sol de Dassa sert à construire routes et habitations ?","o":["Le marbre","Le granite","L'or","Le fer"],"a":1,"e":"Le granite de Dassa, utilisé aussi pour l'épi de Siafato."},{"q":"Le milieu sud-soudanien s'étend de Savè à :","o":["Cotonou","Bembèrèkè","Kandi","Natitingou"],"a":1,"e":"Il est dominé par la pénéplaine cristalline et la savane arborée."},{"q":"Quelle plante domine la savane arborée du sud-soudanien ?","o":["La mangrove","Le karité","Le cocotier","Le palmier à huile"],"a":1,"e":"Avec le néré, le baobab, le kapokier, le cailcédrat."},{"q":"Quel vent sévit fortement dans le milieu nord-soudanien ?","o":["La mousson","L'harmattan","L'alizé maritime","Le typhon"],"a":1,"e":"Avec des températures qui peuvent atteindre 34 °C."},{"q":"Quelle culture est favorisée dans les plaines du Borgou ?","o":["Le cacao","Le coton","Le café","La canne à sucre"],"a":1,"e":"Le milieu nord-soudanien est une zone cotonnière."},{"q":"Quel est le point culminant du Bénin ?","o":["Le mont Sagbarao (658 m)","Le mont Kilimandjaro","La colline de Dassa","Le mont Djami"],"a":0,"e":"Il se trouve dans la chaîne de l'Atacora."},{"q":"Quelle ressource minière trouve-t-on à Perma ?","o":["Le fer","Le marbre","L'or","Le calcaire"],"a":2,"e":"L'or de Perma, dans le milieu atacorien."},{"q":"Quelle est la longueur de l'Ouémé ?","o":["190 km","510 km","1 000 km","100 km"],"a":1,"e":"C'est le plus grand fleuve du Bénin."},{"q":"Dans quel lac se jette l'Ouémé ?","o":["Le lac Ahémé","Le lac Nokoué","Le lac Toho","Le lac Tanganyika"],"a":1,"e":"Le Couffo se jette, lui, dans le lac Ahémé."},{"q":"La Pendjari se jette dans :","o":["Le Niger","La Volta","L'Ouémé","Le Mono"],"a":1,"e":"Au Ghana, après sa source dans l'Atacora."},{"q":"Parmi ces actions, laquelle protège les milieux naturels ?","o":["Les feux de brousse","Le reboisement","Le braconnage","Le prélèvement abusif du sable"],"a":1,"e":"Le reboisement, avec l'application des lois et la sensibilisation."}]},{"id":3,"court":"Droits de l'homme et paix","titre":"Comment les droits de l'homme peuvent-ils garantir la culture de la paix ?","duree":"12 h","dom":"Histoire","intro":"Partout dans le monde, des hommes, des femmes et des enfants sont quotidiennement bafoués dans leur dignité et dans leur intégrité. La méconnaissance et le non-respect des textes sont l'une des causes de ces violations, qui vont des atteintes ordinaires aux génocides. À l'inverse, la connaissance et le respect des droits de l'homme sont les fondements de la paix sociale. Que sont les droits de l'homme, comment sont-ils violés, et comment les protéger pour cultiver la paix ?","parts":[{"t":"I. La notion de droits de l'homme","blocks":[{"h":"1.1 Définitions","pts":["Droits humains (droits de l'homme, droits de la personne) : ensemble des droits propres à chaque être humain, sans aucune distinction, et sans lesquels les hommes ne peuvent pas vivre dans la dignité. Ils sont les fondements de la justice, de la paix et de la liberté.","Paix : absence de conflits entre les personnes et entre les pays.","Culture de la paix : ensemble des valeurs, des attitudes, des traditions, des comportements et des modes de vie fondés notamment sur le respect des droits de l'homme et des libertés fondamentales et sur leur promotion (déclaration des Nations unies sur une culture de la paix)."]},{"h":"1.2 Les caractéristiques","pts":["Universels : valables pour tout le monde et partout dans le monde. Inaliénables : personne n'a le droit d'empêcher son prochain d'en jouir, sous aucun prétexte. Indivisibles : ils forment un tout inséparable, indispensable pour vivre dans la dignité. Inhérents : les hommes naissent avec ces droits.","Principes fondateurs : universalité, indivisibilité, indissociabilité, égalité et non-discrimination, imprescriptibilité, solidarité. La Déclaration universelle des droits de l'homme (DUDH) proclame que tous les êtres humains naissent libres et égaux en dignité et en droits, sans distinction aucune, notamment de sexe."]},{"h":"1.3 Les types de droits","pts":["Les droits civiques et politiques : droit à la vie, à la liberté, à la sécurité individuelle, liberté politique, liberté d'opinion, d'expression, de conscience et de religion. Ils sont énoncés aux articles 3 à 21 de la DUDH et 3 à 14 de la Charte africaine des droits de l'homme et des peuples (CADHP).","Les droits économiques et sociaux : droit à la sécurité sociale, au travail, à l'éducation, aux soins de santé, au bien-être de soi-même et de sa famille. Ils figurent aux articles 22 à 27 de la DUDH et 15 à 17 de la CADHP."]},{"h":"1.4 Les devoirs de la personne humaine","pts":["Avoir des droits suppose d'avoir des devoirs : les droits de l'un sont les devoirs de l'autre, et si chacun accomplit ses devoirs, les droits de tous sont garantis.","Devoirs individuels : respecter ses parents, les nourrir et les assister, défendre et préserver l'unité nationale, payer ses impôts.","Devoirs de l'État : promouvoir et assurer l'éducation des citoyens, garantir le respect des droits, l'accès équitable aux soins de santé, à l'information et au travail."]}]},{"t":"II. Les violations des droits de l'homme","blocks":[{"h":"2.1 Dans le milieu local : l'exemple de Bohicon","pts":["Le phénomène des enfants placés (vidomègon) : des parents, généralement pauvres, placent leurs enfants chez des parents aisés qui les font travailler dans des conditions difficiles ; ces enfants n'ont parfois pas accès à l'éducation, aux soins ni aux loisirs.","Le travail illicite des enfants de moins de 14 ans, formellement interdit, mais fréquent : tâches pénibles, notamment sur des chantiers de construction.","Les violences faites aux femmes et aux enfants, physiques (bastonnade exagérée) ou verbales (insultes, dénigrements)."]},{"h":"2.2 Au Bénin et dans le monde","pts":["Autres cas : violences sexuelles, mutilations, enrôlement d'enfants-soldats, massacres ethniques ou génocides (Tutsi du Rwanda, Juifs), privations arbitraires d'eau, restrictions abusives des libertés individuelles (Mali, République démocratique du Congo, Palestine).","Les femmes sont victimes d'inégalités de droit et de fait presque partout : discrimination dans la famille, la communauté et au travail, entretenue par des stéréotypes et des pratiques traditionnelles."]}]},{"t":"III. Quelques génocides en Afrique et dans le monde","blocks":[{"h":"3.1 Définition","pts":["Génocide : destruction de tout ou partie d'un groupe national, ethnique, racial ou religieux. Le mot a été créé en 1944 pour désigner l'extermination des Juifs et des Tsiganes par les nazis ; il désigne aussi le massacre des Tutsi et des Hutu modérés par des extrémistes hutu au Rwanda."]},{"h":"3.2 Le génocide des Tutsi au Rwanda (1994)","pts":["Causes : l'injustice créée par la colonisation. Les colonisateurs ont confié à la minorité tutsi des responsabilités dans l'administration et cantonné la majorité hutu dans l'agriculture et l'ignorance, ce qui a créé de violentes oppositions entre les deux groupes.","Déclenchement et manifestations : le 6 avril 1994, l'avion du président rwandais Juvénal Habyarimana, un Hutu, est abattu près de Kigali. L'événement sert de déclencheur à l'exécution méthodique des Tutsi. Malgré la présence de forces françaises, belges et onusiennes, près d'un million de personnes sont tuées en cent jours seulement.","Conséquences : plus d'un million de Hutu fuient vers la République démocratique du Congo ; en novembre 1994, le Conseil de sécurité de l'ONU crée le Tribunal pénal international pour le Rwanda (TPIR) pour juger les responsables."]},{"h":"3.3 La Shoah (génocide des Juifs d'Europe)","pts":["Causes : pour Hitler et les dirigeants nazis, les Juifs représentent une menace pour la pureté de la race aryenne, un « complot » visant à dominer le monde ; ils sont jugés « inférieurs ». L'objectif nazi est donc de les éliminer.","Manifestations : discrimination systématique contre les Juifs allemands dès l'arrivée de Hitler au pouvoir, exclusion, ghettos, pillages et meurtres. L'extermination devient un programme politique, l'Endlösung ou « solution finale », appliqué en Allemagne et dans les pays alliés ou occupés. À partir de 1941, des camps de concentration et d'extermination sont créés : gazages, fusillades. Des millions de Juifs, de Tsiganes, de Slaves et d'autres minorités sont massacrés. Sur les 76 000 Juifs déportés de France, seuls 2 500 échappent à l'extermination.","Conséquences : le procès de Nuremberg (1945-1946), devant un Tribunal militaire international, juge et condamne les auteurs ; un État juif est créé en Palestine, l'État d'Israël ; une mémoire spécifique de la Shoah se construit progressivement."]},{"h":"3.4 Un autre exemple : le Cambodge","pts":["De 1975 à 1979, les Khmers rouges dominent le Cambodge, vident les villages de leur population, imposent privations, mauvais traitements, déportations, travail forcé et exécutions. Ces massacres font 2 à 3 millions de morts : c'est un véritable génocide."]}]},{"t":"IV. Les conditions de culture et de sauvegarde de la paix","blocks":[{"h":"4.1 Que faire pour protéger les droits de l'homme","pts":["Faire connaître aux populations les lois qui protègent les droits de l'homme ; les autorités doivent les appliquer à leurs niveaux respectifs ; les citoyens doivent adopter des comportements responsables et respecter les droits des autres. Le respect des droits de l'homme permet d'éviter ou de régler de nombreux conflits et de prévenir la révolte des peuples qui se sentent opprimés.","Comportements et actions utiles : meilleure connaissance des textes nationaux et internationaux ; éducation aux droits humains dans toutes les structures ; reconnaissance de l'identité culturelle de l'autre ; accès de tous au minimum vital (logement, soins, nourriture, éducation, habillement) ; accomplissement harmonieux de ses devoirs ; promotion de la non-violence."]},{"h":"4.2 Les instruments de protection","pts":["La DUDH, adoptée par l'ONU le 10 décembre 1948 ; la Charte internationale des droits de l'homme comprend la DUDH et deux pactes internationaux (droits économiques, sociaux et culturels ; droits civils et politiques).","La Charte africaine des droits de l'homme et des peuples de l'Union africaine, adoptée à Nairobi en 1981 ; la Constitution béninoise du 11 décembre 1990.","La conférence d'Helsinki (1975) met l'accent sur la défense des libertés."]},{"h":"4.3 Les institutions qui veillent aux droits de l'homme","pts":["La Ligue des droits de l'homme, Amnesty International (fondée à Londres en 1961), la Police républicaine, et au niveau judiciaire les tribunaux internationaux comme le TPIR et le Tribunal militaire international de Nuremberg."]}]}],"concl":"Les violations des droits humains existent partout dans le monde, des enfants placés aux génocides. L'ignorance et la non-application des textes expliquent cette situation. Il convient donc de connaître les droits de l'homme et de les traduire dans les actes quotidiens : c'est la condition d'une véritable culture de la paix.","fc":[["Que sont les droits humains ?","L'ensemble des droits propres à chaque être humain, sans distinction, sans lesquels on ne peut vivre dans la dignité."],["Cite les quatre caractéristiques des droits humains.","Ils sont universels, inaliénables, indivisibles et inhérents."],["Quelles sont les deux grandes catégories de droits ?","Les droits civiques et politiques, et les droits économiques et sociaux."],["Quels articles de la DUDH énoncent les droits civiques et politiques ?","Les articles 3 à 21 (les droits économiques et sociaux sont aux articles 22 à 27)."],["Qu'est-ce que le vidomègon ?","Le phénomène des enfants placés chez des parents aisés, qui les font travailler dans des conditions difficiles."],["Que signifie le mot génocide et quand est-il créé ?","La destruction de tout ou partie d'un groupe national, ethnique, racial ou religieux ; le mot est créé en 1944."],["Quel événement déclenche le génocide au Rwanda ?","L'avion du président Juvénal Habyarimana est abattu près de Kigali, le 6 avril 1994."],["Quel tribunal juge les responsables du génocide rwandais ?","Le TPIR, créé par le Conseil de sécurité de l'ONU en novembre 1994."],["Qu'est-ce que l'Endlösung ?","La « solution finale » : le programme nazi d'extermination des Juifs."],["Cite trois textes qui protègent les droits de l'homme.","La DUDH (ONU, 1948), la Charte africaine des droits de l'homme et des peuples (Nairobi, 1981), la Constitution béninoise du 11 décembre 1990."]],"quiz":[{"q":"Les droits humains sont inhérents, c'est-à-dire :","o":["On les achète","Les hommes naissent avec ces droits","Seul l'État les donne","Ils sont réservés aux adultes"],"a":1,"e":"Ils appartiennent à chacun dès la naissance."},{"q":"Quelle caractéristique signifie que les droits valent pour tous et partout ?","o":["Inaliénables","Indivisibles","Universels","Inhérents"],"a":2,"e":"Universels : valables pour tout le monde et partout."},{"q":"Le droit à l'éducation fait partie des droits :","o":["Civiques et politiques","Économiques et sociaux","Militaires","Religieux"],"a":1,"e":"Articles 22 à 27 de la DUDH."},{"q":"La liberté d'opinion et d'expression est un droit :","o":["Économique et social","Civique et politique","Sans importance","Réservé aux journalistes"],"a":1,"e":"Elle relève des droits civiques et politiques (articles 3 à 21 de la DUDH)."},{"q":"Parmi ces devoirs, lequel est un devoir de l'État ?","o":["Payer ses impôts","Garantir l'accès équitable aux soins de santé","Respecter ses parents","Défendre l'unité nationale"],"a":1,"e":"L'État doit aussi assurer l'éducation et le respect des droits."},{"q":"Le vidomègon désigne :","o":["Un marché","Un enfant placé chez des parents aisés","Un chef traditionnel","Une danse"],"a":1,"e":"Un phénomène courant, qui viole les droits de l'enfant."},{"q":"L'âge minimum sous lequel le travail des enfants est formellement interdit (fiche) est :","o":["10 ans","14 ans","18 ans","21 ans"],"a":1,"e":"Le travail illicite des moins de 14 ans."},{"q":"Le mot génocide est créé en :","o":["1914","1944","1994","2001"],"a":1,"e":"Pour désigner l'extermination des Juifs et des Tsiganes par les nazis."},{"q":"Le génocide rwandais est déclenché le :","o":["6 avril 1994","6 avril 1944","1er janvier 1990","10 décembre 1948"],"a":0,"e":"Après l'attentat contre l'avion du président Habyarimana."},{"q":"Combien de personnes sont tuées en cent jours au Rwanda (ordre de grandeur) ?","o":["10 000","Près d'un million","50 millions","500"],"a":1,"e":"Près d'un million de personnes."},{"q":"Le TPIR est créé en :","o":["Novembre 1994","Mai 1968","Juillet 1945","Mars 2003"],"a":0,"e":"Par le Conseil de sécurité de l'ONU."},{"q":"Le programme nazi d'extermination des Juifs s'appelle :","o":["Le plan Marshall","L'Endlösung (solution finale)","Le New Deal","La Realpolitik"],"a":1,"e":"Appliqué à partir de 1941 dans les camps."},{"q":"Le procès de Nuremberg a lieu en :","o":["1945-1946","1914-1918","1960","1994"],"a":0,"e":"Devant un Tribunal militaire international."},{"q":"Les Khmers rouges dominent le Cambodge de :","o":["1945 à 1948","1975 à 1979","1990 à 1994","2001 à 2004"],"a":1,"e":"Leurs massacres font 2 à 3 millions de morts."},{"q":"Quel texte béninois garantit les droits de l'homme ?","o":["La Constitution du 11 décembre 1990","Le traité de Versailles","Le code de l'indigénat","La Charte des Nations unies de 1919"],"a":0,"e":"Avec la DUDH et la Charte africaine des droits de l'homme et des peuples."}]},{"id":4,"court":"Démographie du Bénin","titre":"Quels sont les problèmes liés à l'évolution démographique en République du Bénin ?","duree":"18 h","dom":"Géographie","intro":"Les milieux naturels de la République du Bénin subissent constamment l'influence de l'homme. L'augmentation de la population, qui s'explique par plusieurs facteurs, transforme les espaces, en ville comme à la campagne. Les conséquences de cette situation sont nombreuses et exigent des mesures appropriées en faveur d'un développement durable. Comment la population du Bénin a-t-elle évolué, quels problèmes cette évolution pose-t-elle et quelles mesures adopter ?","parts":[{"t":"I. L'évolution de la population béninoise","blocks":[{"h":"1.1 L'état des lieux","pts":["Évolution de l'effectif : 898 000 habitants en 1910 ; 1 528 000 en 1950 ; 2 106 000 en 1961 ; 3 331 210 en 1979 ; 9 983 884 en 2013 ; 22 100 000 attendus en 2050 si la tendance se poursuit. La croissance est rapide par rapport aux ressources.","Le taux d'accroissement passe de 1,8 % entre 1910 et 1950 à 2,8 % entre 1979 et 1992 : le rythme s'accélère.","La répartition de la population varie selon le sexe, le département et le milieu (ville ou campagne)."]},{"h":"1.2 La structure de la population","pts":["Une population très jeune : 4 % d'enfants de moins d'un an, 17 % de moins de 5 ans et 47 % de moins de 15 ans ; plus de 50 % de la population avait moins de 16 ans au recensement de 1992.","Une population à dominance féminine : environ 49 % d'hommes et 51 % de femmes. La pyramide des âges, à base très large et à sommet étroit, traduit cette jeunesse."]},{"h":"1.3 Les mouvements naturels","pts":["La natalité : nombre de naissances enregistrées dans une population en une période donnée. Le taux de natalité est le nombre de naissances pour 1 000 habitants : 49 ‰ en 2012 au Bénin.","Facteurs de la forte natalité : amélioration des soins de santé néonatale, fécondité élevée, meilleur état nutritionnel, niveau d'instruction ; fécondité élevée aussi à cause du taux de fécondité des adolescentes et des femmes de plus de 35 ans, de l'entrée précoce des filles en union (surtout en milieu rural), de l'universalité du mariage, de la faible utilisation de la contraception et de la polygamie persistante.","La mortalité : nombre de décès enregistrés dans une population en une période donnée. Le taux de mortalité est le nombre de décès pour 1 000 habitants : 19 ‰ en 2012, surtout élevée chez les enfants. Elle est en baisse grâce à l'amélioration de la qualité de vie, aux progrès de la médecine, à la généralisation de l'hygiène et aux mesures socio-sanitaires.","L'accroissement naturel : différence entre le nombre de naissances et le nombre de décès. Le taux d'accroissement naturel se calcule pour 100 habitants : environ 3 % entre 2002 et 2013. Avec une natalité élevée et une mortalité en baisse, la population augmente vite."]},{"h":"1.4 Les mouvements dans l'espace","pts":["Les migrations internes se font à l'intérieur du pays : exode rural, déplacements d'une ville à une autre ou de la ville vers la banlieue. Elles expliquent la croissance rapide de villes comme Cotonou, Abomey-Calavi, Porto-Novo, Bohicon et Parakou. Les jeunes ruraux partent vers les centres urbains en quête d'emploi rémunérateur et de loisirs ; d'autres quittent l'Atacora vers le Borgou et le Zou-Nord à la recherche de terres.","Les migrations externes : émigrations (départs du Bénin) et immigrations (arrivées au Bénin). Elles sont dominées par le départ d'enfants mineurs et de jeunes diplômés vers les pays développés (Canada, États-Unis, Europe de l'Ouest) ou vers des pays africains (Nigeria, Gabon, Congo, Côte d'Ivoire). Elles répondent à la recherche d'un mieux-être et peuvent être volontaires ou forcées ; le trafic d'enfants se développe entre le Bénin et les pays voisins.","Le solde migratoire : différence entre l'effectif des immigrés et celui des émigrés."]}]},{"t":"II. Les problèmes liés à l'évolution démographique","blocks":[{"h":"2.1 Dans les milieux urbains","pts":["Problèmes fonciers et développement de bidonvilles qui contrastent avec les quartiers résidentiels huppés ; boom démographique ; mauvaise qualité de vie dans les ménages sans grands moyens ; problèmes de santé et de nutrition ; problèmes d'aménagement urbain ; insécurité ; problèmes de scolarisation et d'emploi ; pollutions environnementales.","L'exode rural amène de nouveaux ménages qui ont besoin de logement, d'assainissement, d'hygiène, de communication et d'énergie. Dans les grandes villes, la production de déchets était évaluée à 1 000 m³ par jour en 1992 ; la précarité des voies, l'insuffisance des transports en commun et le bas niveau du pouvoir d'achat ont favorisé la multiplication de moyens de transport très polluants.","Au Bénin, une ville est une localité d'au moins deux mille habitants dont une grande partie de la population exerce des activités non essentiellement agricoles. L'armature urbaine correspond aux régions côtières et à l'axe Cotonou-Malanville. Les villes se développent grâce à leurs fonctions : Cotonou grâce à son port, à sa gare et à son aéroport ; Parakou grâce à sa fonction de transit ; Porto-Novo, Abomey et Ouidah grâce à leur histoire."]},{"h":"2.2 Dans les campagnes","pts":["Fécondité élevée ; départ des jeunes capables de travailler la terre ; problèmes de santé et de nutrition ; vieillissement de la population restée au village ; insécurité liée à la transhumance dans certaines localités ; recul de la production agricole ; faible espérance de vie.","La pression sur les terres cultivables, dans le cadre d'une agriculture extensive aux outils encore peu évolués, accroît les difficultés d'accès à la terre. La pression sur les plans d'eau entraîne des techniques de pêche nocives pour l'environnement et une stagnation de la production halieutique."]},{"h":"2.3 Un déséquilibre entre population et ressources","pts":["L'effectif de la population ne cesse d'augmenter alors que les ressources disponibles restent faibles : ce déséquilibre entretient la pauvreté du pays et ralentit son développement."]}]},{"t":"III. Les mesures pour mieux gérer les problèmes démographiques","blocks":[{"h":"3.1 Mesures générales","pts":["Information, éducation et communication (IEC) sur les dangers d'une croissance démographique sans croissance économique ; sensibilisation sur les problèmes créés par le déséquilibre entre population et ressources ; appui matériel, technique et financier aux producteurs pour encourager leur sédentarisation dans les campagnes ; renforcement des mesures de sécurité dans les villes et les campagnes."]},{"h":"3.2 Démographie et urbanisation","pts":["Amélioration des plans directeurs d'aménagement des espaces urbains ; réorganisation des transports urbains ; bonne gouvernance environnementale."]},{"h":"3.3 Démographie et santé","pts":["Renforcement des soins préventifs par l'État ; amélioration des soins curatifs ; renforcement de la surveillance des épidémies. Vulgarisation des soins prénatals ; élargissement de la couverture vaccinale des enfants de moins de 5 ans ; renforcement de la lutte contre le paludisme, le sida et les autres infections sexuellement transmissibles."]},{"h":"3.4 Démographie et planification familiale","pts":["Sensibilisation à la planification familiale, pour une taille familiale en équilibre avec les ressources ; sensibilisation à la réduction d'une fécondité qui reste précoce et élevée (5,7 enfants par femme, et 21 % des filles de moins de 20 ans ont déjà eu au moins une naissance vivante) ; protection des enfants, scolarisation et maintien des filles à l'école."]},{"h":"3.5 Démographie et environnement","pts":["IEC sur les activités et comportements qui menacent l'environnement ; actions de répression de toute pollution en ville comme à la campagne ; participation de chacun à des projets de sauvegarde du milieu de vie par des comportements sains."]}]}],"concl":"Le déséquilibre entre une population qui ne cesse d'augmenter et des ressources limitées fait que le pays reste pauvre. Les problèmes de la ville comme ceux de la campagne se résolvent par une prise de conscience individuelle et collective et par des mesures concertées en matière de santé, d'aménagement, de planification familiale et d'environnement, pour que l'équilibre entre l'environnement et la population conduise le Bénin à un développement durable.","fc":[["Quelle était la population du Bénin en 1979 ?","3 331 210 habitants (environ 3,3 millions) ; elle atteint 9 983 884 habitants en 2013."],["Définis la natalité et le taux de natalité.","La natalité est le nombre de naissances d'une période ; le taux de natalité est le nombre de naissances pour 1 000 habitants (49 ‰ au Bénin en 2012)."],["Définis le taux de mortalité.","Le nombre de décès pour 1 000 habitants (19 ‰ au Bénin en 2012)."],["Qu'est-ce que l'accroissement naturel ?","La différence entre le nombre de naissances et le nombre de décès ; son taux est d'environ 3 % entre 2002 et 2013."],["Pourquoi dit-on que la population béninoise est jeune ?","Près de la moitié a moins de 15 ans : 47 % de moins de 15 ans, 17 % de moins de 5 ans."],["Qu'est-ce que l'exode rural ?","Le départ des ruraux, surtout des jeunes, vers les villes en quête d'emploi et de loisirs ; c'est une migration interne."],["Qu'est-ce que le solde migratoire ?","La différence entre le nombre d'immigrés et le nombre d'émigrés."],["Cite trois problèmes des villes liés à la démographie.","Bidonvilles et problèmes fonciers, insécurité, pollution et déchets, chômage, insuffisance du logement et des transports."],["Cite trois problèmes des campagnes liés à la démographie.","Départ des jeunes, vieillissement, recul de la production agricole, insécurité liée à la transhumance, faible espérance de vie."],["Cite trois mesures pour mieux gérer les problèmes démographiques.","IEC sur la croissance démographique, planification familiale, soins préventifs et vaccination, amélioration des plans d'aménagement urbain, lutte contre la pollution."]],"quiz":[{"q":"Le taux de natalité s'exprime pour :","o":["10 habitants","100 habitants","1 000 habitants","1 million d'habitants"],"a":2,"e":"Le nombre de naissances pour 1 000 habitants (en ‰)."},{"q":"Le taux de natalité du Bénin en 2012 est de :","o":["19 ‰","49 ‰","3 ‰","5,7 ‰"],"a":1,"e":"49 ‰ ; le taux de mortalité est de 19 ‰."},{"q":"Le taux de mortalité du Bénin en 2012 est estimé à :","o":["19 ‰","49 ‰","3 %","47 %"],"a":0,"e":"Il est en baisse grâce aux progrès sanitaires."},{"q":"L'accroissement naturel est :","o":["La somme des naissances et des décès","La différence entre naissances et décès","Le nombre d'immigrés","Le nombre de mariages"],"a":1,"e":"Naissances moins décès."},{"q":"Le taux d'accroissement naturel du Bénin entre 2002 et 2013 est d'environ :","o":["0,3 %","3 %","30 %","49 %"],"a":1,"e":"Une natalité élevée et une mortalité en baisse."},{"q":"Quelle part de la population béninoise a moins de 15 ans (fiche) ?","o":["47 %","10 %","80 %","4 %"],"a":0,"e":"Une population extrêmement jeune."},{"q":"La population du Bénin en 1979 est de :","o":["898 000 habitants","3 331 210 habitants","9 983 884 habitants","22 millions d'habitants"],"a":1,"e":"Elle atteint 9 983 884 habitants en 2013."},{"q":"L'exode rural est une migration :","o":["Externe","Interne","Forcée uniquement","Saisonnière uniquement"],"a":1,"e":"Elle se fait à l'intérieur du pays, des campagnes vers les villes."},{"q":"Le solde migratoire est la différence entre :","o":["Naissances et décès","Immigrés et émigrés","Villes et campagnes","Hommes et femmes"],"a":1,"e":"Entre l'effectif des immigrés et celui des émigrés."},{"q":"Quel problème est propre aux milieux urbains ?","o":["Les bidonvilles","Le vieillissement des villages","Le recul de la production agricole","La transhumance"],"a":0,"e":"Bidonvilles, insécurité, pollution, déchets."},{"q":"Quel problème touche surtout les campagnes ?","o":["Le départ des jeunes capables de travailler la terre","Les embouteillages","Les bidonvilles","La pollution due aux transports urbains"],"a":0,"e":"Ainsi que le vieillissement et le recul de la production."},{"q":"En 1992, les grandes villes produisent environ :","o":["10 m³ de déchets par jour","100 m³ par jour","1 000 m³ par jour","1 million de m³ par jour"],"a":2,"e":"La production de déchets était é const SALT="HG4E-BJ-2026";
function cyrb53(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){let ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}

const mem={};
function sget(k){try{const v=localStorage.getItem(k);return v===null?(mem[k]??null):v}catch(e){return mem[k]??null}}
function sset(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
function jget(k,d){try{const v=sget(k);return v?JSON.parse(v):d}catch(e){return d}}

const S={tab:"fiches",epMode:"sa1",sa:null,view:null,quiz:null,fcSa:0,fcI:0,fcShow:false,repTab:"chrono",epSa:null,epOpen:null,shown:{}};

/* ===== Activation : un code = un téléphone ; durée comptée à partir de la 1re activation ===== */
const SERVER_URL=(typeof window!=="undefined"&&window.HG4E_SERVER?String(window.HG4E_SERVER):"").trim();
function normCode(c){return String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");}
function formatOk(c){const n=normCode(c);return n.length===10&&n.slice(0,2)==="4E";}
function codeValide(c){if(!formatOk(c))return false;return HASHES.has(cyrb53(SALT+normCode(c),7).toString(36));}
function deviceId(){let d=sget("dev4e");if(!d){const a=new Uint8Array(12);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256)}d=Array.from(a,x=>x.toString(16).padStart(2,"0")).join("");sset("dev4e",d);}return d;}
function acces(){const a=jget("acces4e",null);if(!a||!a.fin)return false;if(Date.now()>=a.fin)return false;if(SERVER_URL)return true;return codeValide(a.code);}
function accesFin(){const a=jget("acces4e",null);return a&&a.fin?new Date(a.fin):null;}
function messageRefus(raison){
  const c=" Contacte "+OWNER.nom+" au "+OWNER.tel+".";
  if(raison==="autre_appareil")return "Ce code est déjà utilisé sur un autre téléphone : il ne fonctionne que sur le téléphone où il a été activé pour la première fois."+c;
  if(raison==="expire")return "Ce code a expiré : sa durée de validité de "+OWNER.duree+" mois est terminée."+c;
  if(raison==="inactif")return "Ce code doit être activé de nouveau."+c;
  return "Code incorrect. Vérifie-le."+c;
}
async function appelServeur(action,n){
  const r=await fetch(SERVER_URL+(SERVER_URL.indexOf("?")>-1?"&":"?")+"action="+action+"&code="+encodeURIComponent(n)+"&dev="+encodeURIComponent(deviceId()));
  return await r.json();
}
async function activerCode(c){
  const n=normCode(c);
  if(!formatOk(n))return{ok:false,msg:messageRefus("inconnu")};
  if(!SERVER_URL){ /* mode local : pas de limite d'appareil */
    if(!codeValide(n))return{ok:false,msg:messageRefus("inconnu")};
    sset("acces4e",JSON.stringify({code:n,debut:Date.now(),fin:Date.now()+OWNER.duree*30*24*3600*1000}));
    return{ok:true};
  }
  try{
    const j=await appelServeur("activer",n);
    if(j&&j.ok){sset("acces4e",JSON.stringify({code:n,debut:j.debut,fin:j.fin}));return{ok:true};}
    return{ok:false,msg:messageRefus(j&&j.raison)};
  }catch(e){return{ok:false,msg:"Connexion impossible. Pour la première activation, une connexion Internet est nécessaire. Réessaie."};}
}
async function reverifier(){
  const a=jget("acces4e",null);if(!a||!SERVER_URL)return;
  try{
    const j=await appelServeur("verifier",a.code);
    if(j&&j.ok){if(j.fin&&j.fin!==a.fin){a.fin=j.fin;sset("acces4e",JSON.stringify(a));render();}}
    else if(j&&j.definitif){sset("acces4e","");render();}
  }catch(e){/* hors ligne : on garde l'accès local jusqu'à l'échéance */}
}

function libre(i){return i===0||acces();}
function gate(m,pre,back){
  m.innerHTML=(pre||"")+(back?`<button class="back" id="bkg">‹ Retour</button>`:"")+`<div class="gate">
  <span class="badge">Contenu avec code d'accès</span>
  <h2>Débloquer l'application</h2>
  <p>La SA1 (fiche, sujets et quiz) est gratuite. Les SA2 à SA4, les sujets, les repères et les méthodes sont accessibles avec un code.</p>
  <div class="price ui"><b>${OWNER.nom}</b><br>Contact : ${OWNER.tel}<br><br>Code d'accès pour ${OWNER.duree} mois, au choix :<br>• <b>${OWNER.prix}</b><br>• ou <b>${OWNER.pi}</b><br><span class="alt2">Fais ton paiement selon les instructions de ${OWNER.nom}, puis réclame ton code d'accès au ${OWNER.tel}.</span></div>
  <label class="small" for="code">Entre ton code d'accès</label>
  <input class="code" id="code" placeholder="4E-XXXX-XXXX" autocomplete="off" autocapitalize="characters" maxlength="13">
  <div class="msg" id="msg"></div>
  <button class="btn" id="go">Entrer</button>
  <p class="small" style="margin-top:14px">${SERVER_URL?`Le code est personnel : il ne s'active que sur un seul téléphone et reste valable ${OWNER.duree} mois à partir du jour de sa première activation. Une connexion Internet est nécessaire pour l'activer. Sur iPhone, installe d'abord l'application sur l'écran d'accueil, puis active ton code depuis son icône.`:`Le code est personnel et valable ${OWNER.duree} mois à partir de son activation.`}</p>
  </div>`;
  const input=$("#code");
  input.addEventListener("input",()=>{let v=input.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,10);let o=v.slice(0,2);if(v.length>2)o+="-"+v.slice(2,6);if(v.length>6)o+="-"+v.slice(6);input.value=o;});
  const go=async()=>{const b=$("#go");$("#msg").textContent="Vérification…";b.disabled=true;const r=await activerCode(input.value);b.disabled=false;if(r.ok){render();}else{$("#msg").textContent=r.msg;}};
  $("#go").onclick=go;input.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  if(back)$("#bkg").onclick=()=>{back();render();window.scrollTo(0,0);};
}

function render(){
  const tabs=[["fiches","Fiches"],["epreuves","Épreuves"],["quiz","Quiz"],["reviser","Réviser"],["reperes","Repères"],["methodes","Méthodes"]];

  <main id="main"></main>
  <nav class="tabs" aria-label="Sections">${tabs.map(([k,l])=>`<button data-t="${k}" class="${S.tab===k?"on":""}">${l}</button>`).join("")}</nav>`;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.sa=null;S.quiz=null;S.epSa=null;S.epOpen=null;S.epMode="sa1";render();window.scrollTo(0,0);});
  const m=$("#main");
  ({fiches:vFiches,epreuves:vEpreuves,quiz:vQuiz,reviser:vReviser,reperes:vReperes,methodes:vMethodes})[S.tab](m);
}

function saList(m,titre,sub,onPick){
  m.innerHTML=`<h2 class="sa-title">${titre}</h2><p class="small" style="margin-top:-4px">${sub}</p>`+SA.map((s,i)=>`<button class="sa-btn" data-i="${i}"><div class="row"><span class="num">${s.id}</span><div><b>SA${s.id} · ${esc(s.court)}${(i>0&&!acces())?" 🔒":""}</b><span>${esc(s.titre)}</span></div></div></button>`).join("");

function vFiches(m){
  if(S.sa===null){const lus=jget("lus4e",[]);saList(m,"Fiches de cours","Cours résumés selon la progression officielle 2026-2027. SA1 gratuite. "+lus.length+" fiche(s) lue(s) sur "+SA.length+".",i=>{S.sa=i});return;}
  if(!libre(S.sa)){gate(m,"",()=>{S.sa=null});return;}
  const s=SA[S.sa];const lus=jget("lus4e",[]);const lu=lus.includes(s.id);
  m.innerHTML=`<button class="back" id="bk">‹ Toutes les fiches</button>
  <span class="badge">SA${s.id} · ${s.dom} · ${s.duree}</span>

  <div class="box"><b class="ui">Conclusion.</b> ${esc(s.concl)}</div>
  <button class="btn ${lu?"alt":""}" id="lu">${lu?"Fiche lue ✓ (appuie pour annuler)":"Marquer cette fiche comme lue"}</button>
  <div style="height:10px"></div>
  <button class="btn alt" id="toquiz">Faire le quiz de cette SA</button>`;
  $("#bk").onclick=()=>{S.sa=null;render();};
  $("#lu").onclick=()=>{const l=jget("lus4e",[]);const n=l.includes(s.id)?l.filter(x=>x!==s.id):[...l,s.id];sset("lus4e",JSON.stringify(n));render();};
  $("#toquiz").onclick=()=>{S.tab="quiz";S.quiz=null;startQuiz(S.sa);render();window.scrollTo(0,0);};

const BEPC={"meth":"\n<p class=\"sub\">Format en vigueur au Bénin · dissertation et explication de texte · classe de 4e · données actualisées en octobre 2026</p>\n\n<h2 id=\"format\">1. Le format de l'épreuve</h2>\n<div class=\"scroll\"><table>\n<tr><th>Élément</th><th>Ce qu'il faut retenir</th></tr>\n<tr><td>Composition</td><td>En classe de 4e, chaque évaluation d'<b>Histoire</b> ou de <b>Géographie</b> est soit une <b>dissertation</b>, soit une <b>explication de texte</b> (le programme parle aussi d'explication de document : c'est le même exercice). Les deux exercices sont possibles dans les quatre situations d'apprentissage.</td></tr>\n<tr><td>Présentation d'un sujet</td><td><b>Contexte d'évaluation</b> → <b>Tâche</b> → (<b>Support : texte et sa source</b> pour l'explication de texte) → <b>Consigne</b> (trois consignes au plus en dissertation, chacune sur un seul volet).</td></tr>\n<tr><td>Les 4 SA</td><td>SA1 Histoire (traite transatlantique) ; SA2 Géographie (atouts des milieux naturels du Bénin) ; SA3 Histoire (droits de l'homme et culture de la paix) ; SA4 Géographie (problèmes liés à l'évolution démographique au Bénin).</td></tr>\n<tr><td>Apprentissage des techniques</td><td>Dans la progression de l'année : technique de la dissertation en Histoire (après la SA1) et en Géographie (après la SA2) ; technique de l'explication de document en Histoire (après la SA3) et en Géographie (après la SA4).</td></tr>\n<tr><td>Principe général</td><td>Les consignes guident le plan : <b>autant de consignes, autant de paragraphes</b>, et <b>chaque consigne ne porte que sur un seul volet</b>. On répond avec les savoirs construits en classe (la fiche de cours), jamais avec des idées étrangères au cours.</td></tr>\n</table></div>\n\n<h3>Les verbes d'habileté</h3>\n<p>Chaque verbe de la consigne appelle une réponse précise.</p>\n<div class=\"scroll\"><table>\n<tr><th>Verbe</th><th>Ce qu'il demande</th></tr>\n<tr><td><b>Citer, énumérer</b></td><td>Énoncer successivement, dans l'ordre, sans développer (à manier avec prudence en évaluation).</td></tr>\n<tr><td><b>Identifier</b></td><td>Reconnaître exactement un fait, une situation.</td></tr>\n<tr><td><b>Présenter</b></td><td>Faire connaître le sujet de façon organisée.</td></tr>\n<tr><td><b>Décrire</b></td><td>Donner un développement détaillé, avec plus d'informations.</td></tr>\n<tr><td><b>Exposer</b></td><td>Faire un développement explicatif (les faits et leur explication).</td></tr>\n<tr><td><b>Expliquer</b></td><td>Faire comprendre par les causes, les raisons, les mécanismes.</td></tr>\n<tr><td><b>Dégager l'intérêt</b></td><td>(Histoire) dire ce que l'étude du texte a permis de mieux comprendre.</td></tr>\n<tr><td><b>Donner son opinion / son point de vue</b></td><td>(Géographie) prendre position et justifier brièvement.</td></tr>\n</table></div>\n\n<h2 id=\"diss\">2. Méthode de la dissertation</h2>\n<p>La dissertation est un devoir rédigé qui organise des connaissances sur un sujet, selon une démarche rigoureuse, autour d'une problématique claire. Elle comporte trois parties : introduction, corps du devoir, conclusion.</p>\n\n<div class=\"box rule\"><div class=\"t\">Règles de présentation</div>\nPas de tirets, pas d'astérisques, pas de lignes vides ou sautées. Chaque partie est rédigée <b>en bloc</b> et répartie en paragraphes. On commence le corps du devoir par une phrase introductive.</div>\n\n<h3>A. L'introduction : un bloc unique, les « 3 P »</h3>\n<div class=\"scroll\"><table>\n<tr><th>Élément</th><th>Rôle</th><th>Comment le trouver</th></tr>\n<tr><td><b>Préambule</b> (idée générale)</td><td>Situer le contexte historique (Histoire) ou le cadre géographique (Géographie). Une ou deux phrases au plus : une phrase générale qui amène la problématique sans l'enfermer.</td><td>Histoire : les circonstances qui ont mené au sujet. Géographie : le grand ensemble dans lequel il s'insère.</td></tr>\n<tr><td><b>Problématique</b> (idée maîtresse)</td><td>Dire sur quoi porte la dissertation. C'est le
